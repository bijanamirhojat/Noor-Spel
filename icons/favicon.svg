<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="0.5" stop-color="#764ba2"/>
      <stop offset="1" stop-color="#f093fb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9ecf"/>
      <stop offset="1" stop-color="#ff5fa2"/>
    </linearGradient>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <path d="M0-10 Q1.5-1.5 10 0 Q1.5 1.5 0 10 Q-1.5 1.5-10 0 Q-1.5-1.5 0-10Z" fill="#ffe66d"/>
    </symbol>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="290" r="230" fill="url(#glow)"/>

  <!-- towers -->
  <rect x="112" y="200" width="78" height="210" rx="6" fill="#fff"/>
  <rect x="322" y="200" width="78" height="210" rx="6" fill="#fff"/>
  <rect x="210" y="176" width="92" height="120" rx="6" fill="#fff"/>
  <!-- wall with battlements -->
  <path d="M168 262 h20 v-22 h28 v22 h22 v-22 h36 v22 h22 v-22 h28 v22 h20 V410 H168Z" fill="#fff"/>
  <!-- roofs -->
  <path d="M100 206 L151 104 L202 206Z" fill="url(#roof)"/>
  <path d="M310 206 L361 104 L412 206Z" fill="url(#roof)"/>
  <path d="M198 182 L256 66 L314 182Z" fill="url(#roof)"/>
  <!-- flag -->
  <path d="M256 66 V36" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <path d="M258 36 L290 46 L258 56Z" fill="#ffe66d"/>
  <!-- door & windows -->
  <path d="M226 410 V350 a30 30 0 0 1 60 0 V410Z" fill="#c56cf0"/>
  <rect x="139" y="250" width="24" height="36" rx="12" fill="#a78bfa"/>
  <rect x="349" y="250" width="24" height="36" rx="12" fill="#a78bfa"/>
  <path d="M256 236 c-8-12-26-6-20 8 l20 18 l20-18 c6-14-12-20-20-8Z" fill="#ff6b9d"/>

  <use href="#spark" x="66" y="96" width="44" height="44"/>
  <use href="#spark" x="410" y="70" width="34" height="34"/>
  <use href="#spark" x="420" y="300" width="28" height="28"/>
</svg>
