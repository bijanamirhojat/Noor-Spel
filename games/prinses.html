            ['💎', '👑', '💍', '🪙', '⭐'].forEach((e, i) => {
                const f = tempEl(`<div class="magic-fly">${e}</div>`, x - 18, y - 20, 3300);
                f.style.setProperty('--dx', ((i - 2) * 70) + 'px');
                f.style.setProperty('--dy', (-160 - Math.random() * 80) + 'px');
            });
            setTimeout(() => tr.classList.remove('open'), 4500);
        }

        /* ─────────── Poppenhuis ─────────── */
        const DH_ROOMS = [
            { k: 'toys', icon: '🧸', bg: 'linear-gradient(180deg, #fef3c7, #fde68a)', fx: '⭐' },
            { k: 'sleep', icon: '🛏️', bg: 'linear-gradient(180deg, #e0e7ff, #c7d2fe)', fx: '💤' },
            { k: 'bath', icon: '🛁', bg: 'linear-gradient(180deg, #cffafe, #a5f3fc)', fx: '🫧' },
            { k: 'music', icon: '🎹', bg: 'linear-gradient(180deg, #fce7f3, #fbcfe8)', fx: '🎵' },
            { k: 'food', icon: '🍰', bg: 'linear-gradient(180deg, #fee2e2, #fecaca)', fx: '😋' },
            { k: 'garden', icon: '🌻', bg: 'linear-gradient(180deg, #dcfce7, #bbf7d0)', fx: '🦋' }
        ];
        const DH_CHARS = ['🐻', '🐰', '🐼', '🦊', '🐸', '🐧', '🐨', '🦄', '🧚', '🐱', '🐶', '🐷', '🐵', '🐹'];
        const DH_SOUNDS = {
            toys: () => playFreqSweep(300, 900, 0.25, 0.15),
            sleep: () => [784, 659, 523].forEach((f, i) => setTimeout(() => playTone(f, 0.4, 0.1), i * 300)),
            bath: () => { playFreqSweep(1200, 300, 0.2, 0.15); setTimeout(() => playFreqSweep(1400, 400, 0.15, 0.1), 200); },
            music: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.2, 0.12, 'triangle'), i * 120)),
            food: () => [0, 200, 400].forEach(t => setTimeout(() => playTone(280, 0.08, 0.18, 'triangle'), t)),
            garden: () => [1319, 1568, 2093].forEach((f, i) => setTimeout(() => playTone(f, 0.25, 0.08), i * 100))
        };
        const dollEl = document.getElementById('dollOv');
        let dollOpen = false;
        let dh = { chars: [], drag: null, selected: null, placed: 0 };

        function sizeDollhouse() {
            const st = document.getElementById('dhStage').getBoundingClientRect();
            const h = Math.min(st.height, st.width * 0.95);
            const house = document.getElementById('dhHouse');
            house.style.height = h + 'px';
            house.style.width = (h * 1.05) + 'px';
            const roomH = (h * 0.82 - 24) / 3;
            house.querySelectorAll('.dh-furn').forEach(f => { f.style.fontSize = (roomH * 0.55) + 'px'; });
            house.querySelectorAll('.dh-occ').forEach(f => { f.style.fontSize = (roomH * 0.48) + 'px'; });
            document.querySelectorAll('.dh-fx').forEach(f => { f.style.fontSize = (roomH * 0.22) + 'px'; });
        }

        function newDollRound() {
            const chars = shuffle(DH_CHARS.slice()).slice(0, DH_ROOMS.length);
            const rooms = shuffle(DH_ROOMS.map(r => r.k));
            dh.chars = chars.map((e, i) => ({ e, wish: rooms[i], placed: false }));
            dh.placed = 0;
            dh.selected = null;
            document.getElementById('dhAgain').classList.remove('show');
            const house = document.getElementById('dhHouse');
            house.classList.remove('party');
            house.innerHTML = `<div class="dh-roof"></div><div class="dh-body">${DH_ROOMS.map(r =>
                `<div class="dh-room" data-k="${r.k}" style="background:${r.bg}"><span class="dh-furn">${r.icon}</span></div>`).join('')}</div>`;
            house.querySelectorAll('.dh-room').forEach(room => room.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                if (dh.selected !== null) placeChar(dh.selected, room.dataset.k);
            }));
            renderDollShelf();
            sizeDollhouse();
        }

        function renderDollShelf() {
            const shelf = document.getElementById('dhShelf');
            shelf.innerHTML = dh.chars.map((c, i) => {
                const room = DH_ROOMS.find(r => r.k === c.wish);
                return `<button class="dh-char${c.placed ? ' placed' : ''}${dh.selected === i ? ' sel' : ''}" data-i="${i}">${c.e}<span class="wish">${room.icon}</span></button>`;
            }).join('');
            shelf.querySelectorAll('.dh-char').forEach(b => b.addEventListener('pointerdown', (e) => startCharDrag(e, b)));
        }

        function dollPoint(e) {
            const o = dollEl.getBoundingClientRect();
            return { x: e.clientX - o.left, y: e.clientY - o.top };
        }

        function startCharDrag(e, btn) {
            e.stopPropagation();
            const i = +btn.dataset.i;
            if (dh.chars[i].placed) return;
            const ghost = document.createElement('div');
            ghost.className = 'dh-ghost';
            ghost.textContent = dh.chars[i].e;
            const pt = dollPoint(e);
            ghost.style.left = pt.x + 'px';
            ghost.style.top = pt.y + 'px';
            dollEl.appendChild(ghost);
            dh.drag = { i, ghost, sx: e.clientX, sy: e.clientY, moved: false };
            playPop();
        }

        function roomAt(x, y) {
            return [...document.querySelectorAll('.dh-room')].find(r => {
                const b = r.getBoundingClientRect();
                return x >= b.left && x <= b.right && y >= b.top && y <= b.bottom;
            });
        }

        window.addEventListener('pointermove', (e) => {
            const d = dh.drag;
            if (!d) return;
            if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 12) d.moved = true;
            const pt = dollPoint(e);
            d.ghost.style.left = pt.x + 'px';
            d.ghost.style.top = pt.y + 'px';
            document.querySelectorAll('.dh-room').forEach(r => r.classList.remove('glow'));
            const r = roomAt(e.clientX, e.clientY);
            if (r) r.classList.add('glow');
        });

        window.addEventListener('pointerup', (e) => {
            const d = dh.drag;
            if (!d) return;
            dh.drag = null;
            d.ghost.remove();
            document.querySelectorAll('.dh-room').forEach(r => r.classList.remove('glow'));
            const room = roomAt(e.clientX, e.clientY);
            if (room && d.moved) {
                placeChar(d.i, room.dataset.k);
            } else if (!d.moved) {
                dh.selected = dh.selected === d.i ? null : d.i;
                renderDollShelf();
            }
        });

        function placeChar(i, roomKey) {
            const c = dh.chars[i];
            dh.selected = null;
            if (c.placed) return;
            if (c.wish !== roomKey) {
                renderDollShelf();
                const b = document.querySelector(`.dh-char[data-i="${i}"]`);
                if (b) { b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope'); }
                playTone(220, 0.12, 0.1, 'triangle');
                setTimeout(() => playTone(180, 0.15, 0.1, 'triangle'), 140);
                return;
            }
            c.placed = true;
            dh.placed++;
            const room = document.querySelector(`.dh-room[data-k="${roomKey}"]`);
            const occ = document.createElement('span');
            occ.className = 'dh-occ act-' + roomKey;
            occ.textContent = c.e;
            room.appendChild(occ);
            const info = DH_ROOMS.find(r => r.k === roomKey);
            [0, 0.7, 1.4].forEach((delay, k) => {
                const fx = document.createElement('span');
                fx.className = 'dh-fx';
                fx.textContent = info.fx;
                fx.style.left = (20 + k * 18) + '%';
                fx.style.top = (25 + (k % 2) * 10) + '%';
                fx.style.animationDelay = delay + 's';
                room.appendChild(fx);
            });
            sizeDollhouse();
            DH_SOUNDS[roomKey]();
            renderDollShelf();
            const r = room.getBoundingClientRect();
            dinSparkIn(dollEl, r.left + r.width / 2, r.top + r.height / 2);
            if (dh.placed === dh.chars.length) {
                setTimeout(() => {
                    playWin();
                    document.getElementById('dhHouse').classList.add('party');
                    document.querySelectorAll('.dh-room').forEach((rm, k) => setTimeout(() => {
                        const b = rm.getBoundingClientRect();
                        dinSparkIn(dollEl, b.left + b.width / 2, b.top + b.height / 2);
                    }, k * 120));
                    document.getElementById('dhAgain').classList.add('show');
                }, 600);
            }
        }

        function dinSparkIn(container, cx, cy) {
            const o = container.getBoundingClientRect();
            for (let i = 0; i < 8; i++) {
                const s = document.createElement('span');
                s.className = 'scope-spark';
                s.textContent = randomPick(['✨', '⭐', '💖', '🌟']);
                const a = Math.random() * Math.PI * 2;
                const d = 40 + Math.random() * 50;
                s.style.left = (cx - o.left) + 'px';
                s.style.top = (cy - o.top) + 'px';
                s.style.setProperty('--dx', Math.cos(a) * d + 'px');
                s.style.setProperty('--dy', Math.sin(a) * d + 'px');
                container.appendChild(s);
                setTimeout(() => s.remove(), 900);
            }
        }

        function openDollhouse() {
            dollOpen = true;
            dollEl.classList.add('open');
            newDollRound();
            playMusicBox();
        }

        function closeDollhouse() {
            dollOpen = false;
            dollEl.classList.remove('open');
            if (dh.drag) { dh.drag.ghost.remove(); dh.drag = null; }
            _playWhoosh();
        }
        document.getElementById('dhAgainBtn').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            newDollRound();
            playPop();
        });
        document.getElementById('dhClose').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            closeDollhouse();
        });
        dollEl.addEventListener('pointerdown', (e) => e.stopPropagation());
        window.addEventListener('resize', () => { if (dollOpen) sizeDollhouse(); });

        function overlayOpen() { return scopeOpen || nailsOpen || teaOpen || careOpen || embOpen || dressOpen || dinOpen || mapOpen || hpOpen || dollOpen; }

        /* ─────────── Verrekijker ─────────── */
        const scope = document.getElementById('scope');
        const panoBase = document.getElementById('panoBase');
        const panoZoom = document.getElementById('panoZoom');
        const lensWrap = document.getElementById('lensWrap');
        const ringL = document.getElementById('ringL');
        const ringR = document.getElementById('ringR');
        const findList = document.getElementById('findList');
        const ZOOM = 2.4;
        let scopeOpen = false;
        let lens = { x: 0, y: 0, r: 60 };

        const FINDS = [
            { e: '🦄', name: 'Een eenhoorn!', x: 16, y: 66, s: 22 },
            { e: '🐉', name: 'Een lieve draak!', x: 84, y: 24, s: 22 },
            { e: '🦋', name: 'Een vlinder!', x: 42, y: 58, s: 14 },
            { e: '🎈', name: 'Een ballon!', x: 62, y: 12, s: 16 },
            { e: '🐸', name: 'Een kikker!', x: 30, y: 88, s: 14 },
            { e: '🦢', name: 'Een zwaan!', x: 60, y: 80, s: 16 },
            { e: '🐰', name: 'Een konijntje!', x: 90, y: 72, s: 16 }
        ];

        function panoHTML() {
            let h = `<div class="sun"></div><div class="rb"></div>
                <div class="hill" style="left:-10%;top:55%;width:70%;height:70%;background:#86efac"></div>
                <div class="hill" style="left:40%;top:60%;width:80%;height:70%;background:#4ade80"></div>
                <div class="lake"></div>
                <span class="p" style="left:22%;top:18%;font-size:34px">☁️</span>
                <span class="p" style="left:74%;top:10%;font-size:28px">☁️</span>
                <span class="p" style="left:48%;top:30%;font-size:22px">☁️</span>
                <span class="p" style="left:50%;top:48%;font-size:36px">🏰</span>
                <span class="p" style="left:8%;top:78%;font-size:30px">🌳</span>
                <span class="p" style="left:74%;top:60%;font-size:26px">🌳</span>
                <span class="p" style="left:38%;top:72%;font-size:16px">🌼</span>
                <span class="p" style="left:24%;top:76%;font-size:14px">🌷</span>
                <span class="p" style="left:80%;top:88%;font-size:16px">🌸</span>
                <span class="p" style="left:95%;top:55%;font-size:26px">🌲</span>`;
            FINDS.forEach((f, i) => {
                h += `<span class="p find" data-i="${i}" style="left:${f.x}%;top:${f.y}%;font-size:${f.s}px">${f.e}</span>`;
            });
            return h;
        }

        function buildScope() {
            panoBase.innerHTML = panoHTML();
            panoZoom.innerHTML = panoHTML();
            findList.innerHTML = FINDS.map((f, i) => `<span data-i="${i}">${f.e}</span>`).join('');
        }

        function layoutScope() {
            const w = scope.clientWidth;
            const h = scope.clientHeight;
            lens.r = Math.max(50, Math.min(w, h) * 0.2);
            if (!lens.x) { lens.x = w / 2; lens.y = h / 2; }
            renderLens();
        }

        function renderLens() {
            const { x, y, r } = lens;
            const off = r * 0.92;
            const m = `radial-gradient(circle ${r}px at ${x - off}px ${y}px, #000 98%, transparent 100%), radial-gradient(circle ${r}px at ${x + off}px ${y}px, #000 98%, transparent 100%)`;
            lensWrap.style.webkitMaskImage = m;
            lensWrap.style.maskImage = m;
            panoZoom.style.transformOrigin = `${x}px ${y}px`;
            panoZoom.style.transform = `scale(${ZOOM})`;
            [[ringL, x - off], [ringR, x + off]].forEach(([ring, cx]) => {
                ring.style.left = cx + 'px';
                ring.style.top = y + 'px';
                ring.style.width = ring.style.height = (r * 2 + 16) + 'px';
            });
        }

        function openScope() {
            scopeOpen = true;
            scope.classList.add('open');
            lens.x = 0;
            layoutScope();
            speak('Kijk door de verrekijker! Wat zie je?');
            playFreqSweep(400, 1200, 0.3, 0.15);
        }

        function closeScope() {
            scopeOpen = false;
            scope.classList.remove('open');
            _playWhoosh();
        }

        function scopeSpark(x, y) {
            const icons = ['✨', '⭐', '💖', '🌟', '💫'];
            for (let i = 0; i < 10; i++) {
                const s = document.createElement('span');
                s.className = 'scope-spark';
                s.textContent = randomPick(icons);
                const a = Math.random() * Math.PI * 2;
                const d = 60 + Math.random() * 60;
                s.style.left = x + 'px';
                s.style.top = y + 'px';
                s.style.setProperty('--dx', Math.cos(a) * d + 'px');
                s.style.setProperty('--dy', Math.sin(a) * d + 'px');
                scope.appendChild(s);
                setTimeout(() => s.remove(), 900);
            }
        }

        function checkFinds() {
            const w = scope.clientWidth;
            const h = scope.clientHeight;
            if (!scopeOpen || !w || !h) return;
            // Points in the un-zoomed scene that sit under the finger and under each lens centre
            const off = (lens.r * 0.92) / ZOOM;
            const spots = [[lens.x, lens.y], [lens.x - off, lens.y], [lens.x + off, lens.y]];
            const reach = Math.max(22, (lens.r * 0.75) / ZOOM);
            FINDS.forEach((f, i) => {
                if (f.found) return;
                const bx = (f.x / 100) * w;
                const by = (f.y / 100) * h;
                // Where the item appears on screen inside the magnified lens
                const fx = lens.x + (bx - lens.x) * ZOOM;
                const fy = lens.y + (by - lens.y) * ZOOM;
                if (spots.some(([sx, sy]) => Math.hypot(bx - sx, by - sy) < reach)) {
                    f.found = true;
                    panoZoom.querySelector(`.find[data-i="${i}"]`).classList.add('found');
                    panoBase.querySelector(`.find[data-i="${i}"]`).classList.add('found');
                    findList.querySelector(`[data-i="${i}"]`).classList.add('found');
                    scopeSpark(fx, fy);
                    playCorrect();
                    speak(f.name);
                    if (FINDS.every(ff => ff.found)) {
                        setTimeout(() => {
                            playWin();
                            speak('Alles gevonden! Knap hoor!');
                            for (let k = 0; k < 4; k++) {
                                setTimeout(() => scopeSpark(Math.random() * w, Math.random() * h), k * 200);
                            }
                        }, 900);
                        setTimeout(() => {
                            FINDS.forEach((ff, j) => {
                                ff.found = false;
                                scope.querySelectorAll(`[data-i="${j}"]`).forEach(n => n.classList.remove('found'));
                            });
                            closeScope();
                            showToast('🔭 Alles gevonden! 🌟');
                            sparkleShower(state.x, 60, 60);
                        }, 3600);
                    }
                }
            });
        }

        function moveLens(e) {
            const r = scope.getBoundingClientRect();
            lens.x = e.clientX - r.left;
            lens.y = e.clientY - r.top;
            renderLens();
            checkFinds();
        }

        let scopeDown = false;
        scope.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (e.target.closest('.scope-close')) return;
            scopeDown = true;
            moveLens(e);
        });
        scope.addEventListener('pointermove', (e) => {
            if (scopeDown || e.pointerType === 'mouse') moveLens(e);
        });
        window.addEventListener('pointerup', () => { scopeDown = false; });
        document.getElementById('scopeClose').addEventListener('click', (e) => {
            e.stopPropagation();
            closeScope();
        });
        document.getElementById('scopeClose').addEventListener('pointerdown', (e) => e.stopPropagation());

        /* ─────────── Start ─────────── */
        setScene('out');
        buildOutside();
        spawnGems();
        setScene('in');
        buildWorld();
        buildScope();
        buildHands();
        buildNailTools();
        renderWallFrames();
        loadLook();
        applyLook();
        spawnGems();
        resize();
        state.camX = Math.max(0, state.x - state.viewW / 2);
        requestAnimationFrame(frame);
    </script>
</body>
</html>
