<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#f472b6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Noor's Games">
    <title>Prinsessenkasteel</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
    <link rel="manifest" href="../manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        body {
            background: linear-gradient(135deg, #f9a8d4 0%, #c4b5fd 50%, #a5f3fc 100%);
            background-size: 300% 300%;
            animation: bodyShimmer 12s ease-in-out infinite;
        }

        @keyframes bodyShimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .game-container {
            max-width: 980px;
            height: calc(100vh - 30px);
            height: calc(100dvh - 30px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 14px;
        }

        h1 {
            margin-bottom: 6px;
            font-size: 1.5rem;
            color: #db2777;
            text-shadow: 2px 2px 0 #fbcfe8;
        }

        .back-btn {
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            background: #f472b6;
        }

        .back-btn:hover { background: #db2777; }

        .hud {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .pill {
            background: #fdf2f8;
            border: 2px solid #f9a8d4;
            color: #be185d;
            border-radius: 999px;
            padding: 4px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: transform 0.2s ease;
        }

        .pill.bump { transform: scale(1.25); }

        .playfield {
            position: relative;
            flex: 1;
            min-height: 0;
            border-radius: 26px;
            border: 3px solid #f9a8d4;
            overflow: hidden;
            background: #2e1065;
            cursor: pointer;
            touch-action: none;
        }

        .world {
            position: absolute;
            top: 0;
            left: 0;
            width: 4000px;
            height: 500px;
            transform-origin: 0 0;
        }

        #fx {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        /* ── Rooms ── */
        /* Rooms reach 500 units above the world so tall (iPad portrait) screens
           show extra wall instead of zooming in on half a room. */
        .room {
            position: absolute;
            top: -500px;
            width: 800px;
            height: 1000px;
            overflow: hidden;
        }

        .room .wall {
            position: absolute;
            inset: 0 0 100px 0;
        }

        .room .floor {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100px;
            box-shadow: inset 0 12px 18px rgba(0, 0, 0, 0.18);
        }

        .room-sign {
            position: absolute;
            top: 514px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            color: #be185d;
            font-family: 'Fredoka One', cursive;
            font-size: 22px;
            padding: 4px 18px;
            border-radius: 999px;
            border: 3px solid #fbcfe8;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 6;
        }

        .i-room.r0 .wall {
            background:
                repeating-linear-gradient(90deg, #fbcfe8 0 40px, #f9a8d4 40px 80px);
        }
        .i-room.r0 .floor {
            background: conic-gradient(#fdf2f8 25%, #f9a8d4 0 50%, #fdf2f8 0 75%, #f9a8d4 0) 0 0 / 50px 50px;
        }

        .i-room.r1 .wall {
            background:
                radial-gradient(circle, rgba(255,255,255,0.55) 3px, transparent 4px) 0 0 / 46px 46px,
                linear-gradient(180deg, #ddd6fe, #c4b5fd);
        }
        .i-room.r1 .floor {
            background: conic-gradient(#ede9fe 25%, #c4b5fd 0 50%, #ede9fe 0 75%, #c4b5fd 0) 0 0 / 50px 50px;
        }

        .i-room.r3 .wall {
            background:
                repeating-linear-gradient(90deg, #fecdd3 0 30px, #fda4af 30px 34px),
                #fecdd3;
        }
        .i-room.r3 .floor {
            background:
                linear-gradient(90deg, transparent 290px, #e11d48 290px 510px, transparent 510px),
                conic-gradient(#fef3c7 25%, #fcd34d 0 50%, #fef3c7 0 75%, #fcd34d 0) 0 0 / 50px 50px;
        }

        .i-room.r5 .wall {
            background: linear-gradient(180deg, #fff7ed 0%, #fdf2f8 55%, #ecfeff 100%);
        }
        .i-room.r5 .floor {
            background: conic-gradient(#ffffff 25%, #bae6fd 0 50%, #ffffff 0 75%, #fbcfe8 0) 0 0 / 50px 50px;
        }

        .i-room.r6 .wall {
            background:
                radial-gradient(circle at 20% 30%, #fff 1.5px, transparent 2.5px) 0 0 / 70px 60px,
                radial-gradient(circle at 70% 70%, #fde68a 1.5px, transparent 2.5px) 0 0 / 90px 80px,
                linear-gradient(180deg, #1e1b4b, #4c1d95);
        }
        .i-room.r6 .floor {
            background:
                repeating-linear-gradient(90deg, #7c3aed 0 60px, #6d28d9 60px 62px);
        }

        /* Pillars / doorways between rooms */
        .pillar {
            position: absolute;
            top: 0;
            width: 44px;
            height: 1000px;
            background: linear-gradient(90deg, #f5f5f4, #ffffff 40%, #e7e5e4);
            border-left: 3px solid #fde68a;
            border-right: 3px solid #fde68a;
            z-index: 2;
            box-shadow: 0 0 14px rgba(0,0,0,0.2);
        }

        .pillar::before {
            content: '';
            position: absolute;
            left: -10px;
            right: -10px;
            top: 500px;
            height: 28px;
            background: #fcd34d;
            border-radius: 0 0 10px 10px;
        }

        .pillar::after {
            content: '💖';
            position: absolute;
            top: 560px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
        }

        /* ── Objects (tappable) ── */
        .obj {
            position: absolute;
            cursor: pointer;
            z-index: 3;
            transition: transform 0.2s ease;
        }

        .obj.tap { animation: objTap 0.5s ease; }

        @keyframes objTap {
            0%, 100% { transform: scale(1); }
            40% { transform: scale(1.18) rotate(-4deg); }
            70% { transform: scale(0.95) rotate(3deg); }
        }

        .emoji-obj {
            font-size: 64px;
            line-height: 1;
            text-align: center;
            filter: drop-shadow(0 6px 6px rgba(0,0,0,0.2));
        }

        .gleam {
            animation: gleam 2.4s ease-in-out infinite;
        }

        @keyframes gleam {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(255,255,255,0.6)); }
            50% { filter: drop-shadow(0 0 16px rgba(255,236,153,1)); }
        }

        /* Torch */
        .torch {
            width: 30px;
            height: 110px;
        }
        .torch .stick {
            position: absolute;
            bottom: 0;
            left: 9px;
            width: 12px;
            height: 70px;
            background: linear-gradient(90deg, #fbbf24, #fde68a, #f59e0b);
            border-radius: 4px;
        }
        .torch .flame {
            position: absolute;
            bottom: 62px;
            left: 0;
            width: 30px;
            height: 44px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            background: radial-gradient(circle at 50% 70%, #fff 0 18%, #f0abfc 35%, #e879f9 60%, rgba(232,121,249,0) 72%);
            animation: flicker 0.6s ease-in-out infinite alternate;
            transform-origin: 50% 100%;
        }

        @keyframes flicker {
            from { transform: scale(1, 1) rotate(-3deg); }
            to { transform: scale(1.1, 1.18) rotate(3deg); }
        }

        /* Big door */
        .castle-door {
            width: 180px;
            height: 280px;
            border-radius: 90px 90px 0 0;
            background:
                repeating-linear-gradient(90deg, #a16207 0 30px, #854d0e 30px 34px);
            border: 8px solid #fcd34d;
            border-bottom: none;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
        }
        .castle-door::after {
            content: '';
            position: absolute;
            right: 30px;
            top: 150px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fde68a;
            box-shadow: 0 0 10px #fde68a;
        }

        .banner {
            width: 90px;
            height: 150px;
            background: linear-gradient(180deg, #a855f7, #7c3aed);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
            display: flex;
            justify-content: center;
            padding-top: 28px;
            font-size: 40px;
        }

        .frame {
            width: 120px;
            height: 140px;
            border: 10px solid #fbbf24;
            border-radius: 14px;
            background: linear-gradient(180deg, #bae6fd, #fbcfe8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.2), inset 0 0 0 4px #fde68a;
        }

        .rug {
            width: 240px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(ellipse, #f0abfc 0 30%, #c084fc 31% 55%, #f472b6 56% 100%);
            opacity: 0.9;
            z-index: 1;
            pointer-events: none;
        }

        /* Mirror */
        .mirror {
            width: 240px;
            height: 300px;
        }
        .mirror .glass {
            position: absolute;
            inset: 20px;
            border-radius: 50%;
            border: 12px solid #fcd34d;
            background: linear-gradient(135deg, #e0f2fe 0%, #f5d0fe 45%, #ffffff 55%, #cffafe 100%);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255,255,255,0.8), inset 0 0 30px rgba(255,255,255,0.8);
        }
        .mirror .glass::after {
            content: '';
            position: absolute;
            top: -40%;
            left: -60%;
            width: 40%;
            height: 180%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: rotate(25deg);
            animation: shine 3.5s ease-in-out infinite;
        }
        @keyframes shine {
            0%, 60% { left: -60%; }
            100% { left: 140%; }
        }
        .mirror.flash .glass {
            animation: mirrorFlash 0.6s ease;
        }
        @keyframes mirrorFlash {
            0%, 100% { filter: brightness(1); }
            30% { filter: brightness(1.9) saturate(1.5); }
        }
        .mirror .reflection {
            position: absolute;
            left: 50%;
            bottom: -70px;
            width: 150px;
            height: 240px;
            margin-left: -75px;
            transform: scaleX(-1);
            opacity: 0.92;
            transition: margin-left 0.15s linear;
        }
        .mirror .flower {
            position: absolute;
            font-size: 34px;
            line-height: 1;
            transform: translate(-50%, -50%);
            transition: transform 0.3s ease;
        }
        .mirror.flash .flower {
            animation: flowerSpin 0.8s ease;
        }
        @keyframes flowerSpin {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0); }
            50% { transform: translate(-50%, -50%) scale(1.5) rotate(180deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(360deg); }
        }

        .garland {
            position: absolute;
            top: 70px;
            height: 40px;
            font-size: 26px;
            letter-spacing: 6px;
            white-space: nowrap;
            pointer-events: none;
        }

        /* Throne */
        .throne {
            width: 170px;
            height: 250px;
        }
        .throne .back {
            position: absolute;
            left: 15px;
            top: 0;
            width: 140px;
            height: 170px;
            background: linear-gradient(180deg, #e11d48, #be123c);
            border: 10px solid #fbbf24;
            border-radius: 70px 70px 10px 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.25);
        }
        .throne .back::after {
            content: '👑';
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
        }
        .throne .seat {
            position: absolute;
            left: 0;
            top: 160px;
            width: 170px;
            height: 44px;
            background: linear-gradient(180deg, #fb7185, #e11d48);
            border: 8px solid #fbbf24;
            border-radius: 18px;
        }
        .throne .legs {
            position: absolute;
            left: 14px;
            right: 14px;
            top: 200px;
            height: 50px;
            border-left: 14px solid #f59e0b;
            border-right: 14px solid #f59e0b;
        }

        .chandelier {
            width: 150px;
            height: 110px;
        }
        .chandelier .chain {
            position: absolute;
            left: 73px;
            top: 0;
            width: 4px;
            height: 40px;
            background: #fbbf24;
        }
        .chandelier .body {
            position: absolute;
            left: 0;
            top: 40px;
            width: 150px;
            height: 30px;
            border-radius: 0 0 75px 75px;
            background: linear-gradient(180deg, #fde68a, #f59e0b);
        }
        .chandelier .candles {
            position: absolute;
            left: 0;
            top: 14px;
            width: 150px;
            display: flex;
            justify-content: space-around;
            font-size: 22px;
        }
        .chandelier .drops {
            position: absolute;
            left: 10px;
            right: 10px;
            top: 68px;
            display: flex;
            justify-content: space-around;
            font-size: 18px;
        }

        /* Rainbow room */
        .rainbow-window {
            width: 300px;
            height: 170px;
            border-radius: 150px 150px 0 0;
            border: 10px solid #fff;
            border-bottom: none;
            background:
                radial-gradient(circle at 50% 100%,
                    #bae6fd 0 30%,
                    #a855f7 30% 37%,
                    #3b82f6 37% 44%,
                    #22c55e 44% 51%,
                    #facc15 51% 58%,
                    #fb923c 58% 65%,
                    #ef4444 65% 72%,
                    #bae6fd 72%);
            box-shadow: 0 0 30px rgba(255,255,255,0.9);
            pointer-events: none;
        }

        .pedestal {
            width: 110px;
            height: 170px;
        }
        .pedestal .col {
            position: absolute;
            left: 25px;
            bottom: 0;
            width: 60px;
            height: 90px;
            background: linear-gradient(90deg, #f5f5f4, #fff, #e7e5e4);
            border-top: 8px solid #fcd34d;
            border-bottom: 8px solid #fcd34d;
        }
        .pedestal .ball {
            position: absolute;
            left: 10px;
            top: 0;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background:
                conic-gradient(from 0deg, #f472b6, #facc15, #4ade80, #60a5fa, #c084fc, #f472b6);
            box-shadow: 0 0 30px #f0abfc, inset -12px -12px 24px rgba(0,0,0,0.25), inset 12px 12px 24px rgba(255,255,255,0.7);
            animation: spinBall 6s linear infinite;
        }
        @keyframes spinBall { to { filter: hue-rotate(360deg); } }

        .discoball {
            width: 70px;
            height: 110px;
        }
        .discoball .chain {
            position: absolute;
            left: 33px;
            top: 0;
            width: 4px;
            height: 40px;
            background: #d4d4d8;
        }
        .discoball .ball {
            position: absolute;
            left: 0;
            top: 40px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background:
                repeating-linear-gradient(0deg, transparent 0 8px, rgba(0,0,0,0.15) 8px 9px),
                repeating-linear-gradient(90deg, transparent 0 8px, rgba(0,0,0,0.15) 8px 9px),
                radial-gradient(circle at 35% 35%, #fff, #d4d4d8 60%, #a1a1aa);
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
        }

        .rainbow-arc {
            position: absolute;
            left: 0;
            top: 0;
            width: 800px;
            height: 500px;
            pointer-events: none;
            z-index: 1;
        }
        .rainbow-arc path {
            fill: none;
            stroke-width: 22;
            stroke-linecap: round;
            stroke-dasharray: 1400;
            stroke-dashoffset: 1400;
        }
        .rainbow-arc.show path {
            animation: drawArc 1.6s ease forwards;
        }
        @keyframes drawArc { to { stroke-dashoffset: 0; } }

        .disco-light {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0;
            z-index: 1;
        }
        .party .disco-light {
            opacity: 0.55;
            animation: discoMove 2.2s ease-in-out infinite alternate;
        }
        @keyframes discoMove {
            0% { transform: translate(0, 0); }
            50% { transform: translate(180px, 60px); }
            100% { transform: translate(-120px, 120px); }
        }

        /* Tower room */
        .tower-window {
            width: 220px;
            height: 240px;
            border-radius: 110px 110px 0 0;
            border: 12px solid #a78bfa;
            border-bottom-width: 18px;
            background:
                radial-gradient(circle at 70% 30%, #fef9c3 0 22px, rgba(254,249,195,0.3) 23px 34px, transparent 35px),
                radial-gradient(circle at 20% 60%, #fff 1.5px, transparent 2.5px) 0 0 / 40px 36px,
                linear-gradient(180deg, #0c0a3e, #312e81);
            pointer-events: none;
        }
        .telescope {
            width: 150px;
            height: 190px;
        }
        .telescope .tube {
            position: absolute;
            left: 10px;
            top: 30px;
            width: 140px;
            height: 38px;
            border-radius: 12px 20px 20px 12px;
            background: linear-gradient(180deg, #fde68a, #f59e0b 60%, #b45309);
            transform: rotate(-28deg);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .telescope .tube::before {
            content: '';
            position: absolute;
            right: -8px;
            top: -6px;
            width: 22px;
            height: 50px;
            border-radius: 8px;
            background: #fcd34d;
        }
        .telescope .tube::after {
            content: '';
            position: absolute;
            left: 20px;
            top: 4px;
            width: 26px;
            height: 30px;
            border-radius: 6px;
            background: #ec4899;
        }
        .telescope .legs {
            position: absolute;
            left: 50px;
            top: 80px;
            width: 60px;
            height: 110px;
            background:
                linear-gradient(100deg, transparent 44%, #7c2d12 44% 52%, transparent 52%),
                linear-gradient(80deg, transparent 48%, #7c2d12 48% 56%, transparent 56%),
                linear-gradient(90deg, transparent 46%, #92400e 46% 54%, transparent 54%);
        }
        .tap-hint {
            position: absolute;
            top: -34px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            animation: hintBob 1.2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes hintBob {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -10px); }
        }

        /* ── Gems ── */
        .gem {
            position: absolute;
            width: 40px;
            height: 40px;
            margin-left: -20px;
            font-size: 34px;
            line-height: 40px;
            text-align: center;
            z-index: 4;
            pointer-events: none;
            animation: gemBob 1.6s ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.95));
        }
        .gem.got {
            animation: gemGot 0.5s ease forwards;
        }
        @keyframes gemBob {
            0%, 100% { transform: translateY(0) rotate(-6deg); }
            50% { transform: translateY(-12px) rotate(6deg); }
        }
        @keyframes gemGot {
            to { transform: translateY(-120px) scale(1.8); opacity: 0; }
        }

        /* ── Princess ── */
        .princess {
            position: absolute;
            left: 0;
            top: 0;
            width: 120px;
            height: 192px;
            z-index: 10;
            pointer-events: none;
        }
        .princess .flip {
            width: 100%;
            height: 100%;
            transition: transform 0.15s ease;
        }
        .princess.left .flip { transform: scaleX(-1); }
        .princess svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        .princess.walking .bob {
            animation: walkBob 0.36s ease-in-out infinite;
        }
        .princess.walking .skirt {
            animation: skirtSway 0.36s ease-in-out infinite alternate;
            transform-origin: 50px 80px;
        }
        @keyframes walkBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes skirtSway {
            from { transform: rotate(-3deg); }
            to { transform: rotate(3deg); }
        }
        .princess.sitting .bob {
            transform: translateY(-38px);
        }
        .princess.twirl .flip {
            animation: twirl 0.8s ease;
        }
        @keyframes twirl {
            0% { transform: scaleX(1); }
            25% { transform: scaleX(-1); }
            50% { transform: scaleX(1); }
            75% { transform: scaleX(-1); }
            100% { transform: scaleX(1); }
        }
        .wand-star {
            animation: wandTwinkle 1s ease-in-out infinite;
            transform-origin: 88px 58px;
        }
        @keyframes wandTwinkle {
            0%, 100% { transform: scale(1) rotate(0); }
            50% { transform: scale(1.3) rotate(20deg); }
        }

        /* ── Controls ── */
        .arrow {
            position: absolute;
            bottom: 14px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 4px solid #fff;
            background: linear-gradient(135deg, #f472b6, #a855f7);
            color: #fff;
            font-size: 30px;
            font-family: 'Fredoka One', cursive;
            z-index: 30;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
            cursor: pointer;
            touch-action: none;
        }
        .arrow:active { transform: scale(0.92); }

            gap: 8px;

        .hp-heart {

        .hp-envelope {

        .hp-tools { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; z-index: 2; }
        .hp-btn {

        .hp-btn.hint { animation: hintPulse 0.5s ease 3; }

        /* ── Poppenhuiskamer ── */
        .i-room.r13 .wall {
            background:
                repeating-linear-gradient(90deg, #ede9fe 0 30px, #ddd6fe 30px 60px);
        }
        .i-room.r13 .floor {

        .dollhouse-prop .roof {

        }

        /* ── Poppenhuis overlay ── */

            position: absolute;
            inset: 0;

        .dock {

        .lily span { position: absolute; left: 14px; top: -16px; font-size: 22px; }
        .lake-duck { font-size: 42px; z-index: 3; pointer-events: auto; animation: duckSwim 14s linear infinite; }
        @keyframes duckSwim {

        .island { width: 200px; height: 130px; }

        .treasure { position: absolute; left: 110px; bottom: 26px; width: 60px; height: 46px; }
        .treasure .tbox {
            position: absolute; left: 0; bottom: 0; width: 60px; height: 30px;

        const WORLD_H = 500;

        const ROOMS_IN = [
            { name: 'Kasteelhal',    icon: '🏰', say: 'De kasteelhal' },

        let ballMusicOn = false;
        let ballBeatTimer = null;
        let ballBeat = 0;
        const WALTZ = [
            [523, 131], [659, 0], [784, 0], [784, 98], [0, 0], [659, 0],
            [659, 131], [784, 0], [1047, 0], [1047, 98], [0, 0], [988, 0],
            [587, 147], [698, 0], [880, 0], [880, 110], [0, 0], [698, 0],
            [698, 98], [880, 0], [1175, 0], [1047, 131], [988, 0], [784, 0]
        ];

        function ballBeatStep() {
            const [mel, bass] = WALTZ[ballBeat % WALTZ.length];
            if (mel) playTone(mel, 0.32, 0.09, 'triangle');
            if (bass) playTone(bass, 0.5, 0.14, 'sine');
            if (ballBeat % 3 !== 0) playTone(bass ? bass * 2 : 262, 0.1, 0.04, 'sine');
            ballBeat++;
            // Light a few random tiles on every beat
            const now = performance.now();
            for (let k = 0; k < 3; k++) {
                const t = randomPick(state.tiles);
                t.until = now + 380;
            }
        }

        function startBallMusic() {
            if (ballMusicOn) return;
            ballMusicOn = true;
            ballBeat = 0;
            SCENES.in.el.classList.add('music');
            ballBeatStep();
            ballBeatTimer = setInterval(ballBeatStep, 400);
        }

        function stopBallMusic() {
            if (!ballMusicOn) return;
            ballMusicOn = false;
            SCENES.in.el.classList.remove('music');
            clearInterval(ballBeatTimer);
        }

        function toggleBallMusic() {
            if (ballMusicOn) {
                stopBallMusic();
            } else {
                startBallMusic();
                sparkleShower(ROOM_W * BALL_IDX + 100, 200, 30);
            }
        }

        function inBallroom() {
            return scene.key === 'in' && state.room === BALL_IDX;
        }

        function updateBallroom() {
            const inBall = inBallroom();
            document.getElementById('danceBar').classList.toggle('show', inBall);
            if (inBall) startBallMusic();
            else stopBallMusic();
        }

        function updateTiles(now) {
            if (!inBallroom()) return;
            const col = Math.floor((state.x - ROOM_W * BALL_IDX - BALL_TILE_X0) / 50);
            state.tiles.forEach(t => {
                if (t.col === col && t.row === 1 && state.alt === 0) t.until = Math.max(t.until, now + 300);
                const on = now < t.until;
                if (on !== t.on) {
                    t.on = on;
                    t.node.classList.toggle('lit', on);
                }
            });
        }

        const DANCE_MOVES = ['spin', 'jump', 'sway', 'cartwheel', 'bow'];

        function danceMove(kind) {
            if (state.busy) return;
            const dancers = [princessEl().querySelector('.dancer'), document.querySelector('#prince .dancer')];
            dancers.forEach(d => {
                if (!d) return;
                DANCE_MOVES.forEach(m => d.classList.remove('move-' + m));
                void d.offsetWidth;
                d.classList.add('move-' + kind);
                clearTimeout(d._t);
                d._t = setTimeout(() => d.classList.remove('move-' + kind), 1250);
            });
            // Prince turns to face the princess
            const prince = document.getElementById('prince');
            if (prince) prince.classList.toggle('left', state.x < ROOM_W * BALL_IDX + 520);

            const sounds = {

                if (state.hold === dir) {

            if (particles.length >= MAX_PARTICLES) particles.shift();
            const a = Math.random() * Math.PI * 2;
            const sp = (opts.speed || 120) * (0.3 + Math.random() * 0.7);
            particles.push({
                x, y,
                vx: opts.vx !== undefined ? opts.vx : Math.cos(a) * sp,
                vy: opts.vy !== undefined ? opts.vy : Math.sin(a) * sp,
                g: opts.g !== undefined ? opts.g : 60,
                life: 0,
                max: opts.max || (0.7 + Math.random() * 0.9),
                size: opts.size || (4 + Math.random() * 7),
                hue: opts.hue !== undefined ? opts.hue : Math.random() * 360,
                spin: Math.random() * Math.PI,
                tw: Math.random() * 10
            });
        }

        function burst(x, y, n) {
            for (let i = 0; i < n; i++) spawnSparkle(x, y, { speed: 180 });
        }

        function sparkleShower(x, y, n) {
            for (let i = 0; i < n; i++) {
                spawnSparkle(x + (Math.random() - 0.5) * 300, y + Math.random() * 40, {
                    vx: (Math.random() - 0.5) * 40,
                    vy: 30 + Math.random() * 80,
                    g: 40,
                    max: 1.6 + Math.random() * 1.2
                });
            }
        }

        function drawHeartShape(x, y, r) {
            ctx2d.beginPath();
            ctx2d.moveTo(x, y + r * 0.9);
            ctx2d.bezierCurveTo(x - r * 1.7, y - r * 0.2, x - r * 0.7, y - r * 1.4, x, y - r * 0.45);
            ctx2d.bezierCurveTo(x + r * 0.7, y - r * 1.4, x + r * 1.7, y - r * 0.2, x, y + r * 0.9);
            ctx2d.fill();
        }

        function drawStar(x, y, r, rot) {
            ctx2d.beginPath();
            for (let i = 0; i < 8; i++) {
                const rad = i % 2 === 0 ? r : r * 0.28;
                const a = rot + (i * Math.PI) / 4;
                ctx2d.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
            }
            ctx2d.closePath();
            ctx2d.fill();
        }

        function updateParticles(dt, now) {
            const party = now < state.partyUntil;

            // Ambient twinkles everywhere in view
            const ambient = party ? 6 : 1.2;
            for (let i = 0; i < ambient; i++) {
                if (Math.random() < ambient - i) {
                    spawnSparkle(state.camX + Math.random() * state.viewW, -state.offsetY / state.scale + Math.random() * (WORLD_H + state.offsetY / state.scale), {
                        vx: 0, vy: party ? 40 : -8, g: 0, speed: 0,
                        max: 0.8 + Math.random() * 0.8,
                        size: party ? 5 + Math.random() * 8 : 3 + Math.random() * 4
                    });
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life += dt;
                if (p.life >= p.max) { particles.splice(i, 1); continue; }
                p.vy += p.g * dt;
                p.vx *= 0.98;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.spin += dt * 2;
            }
        }

        function drawParticles(now) {
            const dpr = window.devicePixelRatio || 1;
            ctx2d.setTransform(1, 0, 0, 1, 0, 0);
            ctx2d.clearRect(0, 0, canvas.width, canvas.height);
            ctx2d.setTransform(dpr * state.scale, 0, 0, dpr * state.scale, -state.camX * state.scale * dpr, state.offsetY * dpr);
            const hearts = scene.key === 'in' && state.room === HEART_IDX;
            ctx2d.globalCompositeOperation = hearts ? 'source-over' : 'lighter';
            for (const p of particles) {
                const t = p.life / p.max;
                const alpha = Math.sin(Math.PI * t) * (0.6 + 0.4 * Math.sin(now / 90 + p.tw));
                const s = p.size * (0.6 + 0.4 * Math.sin(now / 120 + p.tw));
                if (hearts) {
                    ctx2d.fillStyle = `hsla(${330 + (p.hue % 50)}, 95%, 62%, ${alpha})`;
                    drawHeartShape(p.x, p.y, s * 1.1);
                    ctx2d.fillStyle = `rgba(255,255,255,${alpha * 0.7})`;
                    ctx2d.beginPath();
                    ctx2d.arc(p.x - s * 0.35, p.y - s * 0.25, s * 0.22, 0, Math.PI * 2);
                    ctx2d.fill();
                    continue;
                }
                ctx2d.fillStyle = `hsla(${p.hue}, 100%, 72%, ${alpha})`;
                drawStar(p.x, p.y, s, p.spin);
                ctx2d.fillStyle = `rgba(255,255,255,${alpha * 0.9})`;
                drawStar(p.x, p.y, s * 0.45, p.spin);
            }
            ctx2d.globalCompositeOperation = 'source-over';
        }

        /* ─────────── Layout ─────────── */
        function resize() {
            const w = playfield.clientWidth;
            const h = playfield.clientHeight;
            state.scale = Math.min(h / WORLD_H, w / MIN_VIEW_W);
            state.viewW = w / state.scale;
            state.offsetY = h - WORLD_H * state.scale;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            if (scopeOpen) layoutScope();
        }
        window.addEventListener('resize', resize);
        if (window.ResizeObserver) new ResizeObserver(resize).observe(playfield);

        /* ─────────── Main loop ─────────── */
        function frame(now) {
            const dt = Math.min(0.05, (now - state.lastTime) / 1000);
            state.lastTime = now;

            if (!overlayOpen() && !state.busy) {
                if (state.hold) {
                    state.targetX = clampX(state.x + state.hold * 200);
                }
                const dx = state.targetX - state.x;
                const p = princessEl();
                const speed = state.riding ? RIDE_SPEED : state.boating ? 220 : SPEED;
                if (Math.abs(dx) > 1.5) {
                    const step = Math.sign(dx) * Math.min(Math.abs(dx), speed * dt);
                    state.x += step;
                    state.facing = Math.sign(dx);
                    p.classList.add('walking');
                    // Glitter trail from the skirt hem
                    if (Math.random() < 0.8) {
                        spawnSparkle(state.x - state.facing * 30 + (Math.random() - 0.5) * 40, FEET_Y - 10 - Math.random() * 30, {
                            vx: -state.facing * 30, vy: -20 - Math.random() * 30, g: 20, size: 3 + Math.random() * 5
                        });
                    }
                    if (state.riding) {
                        // Rainbow trail from the tail + clip-clop hooves
                        for (let k = 0; k < 3; k++) {
                            spawnSparkle(state.x - state.facing * 80, FEET_Y - 110 - state.alt + Math.random() * 50, {
                                vx: -state.facing * 60, vy: (Math.random() - 0.5) * 30, g: 0,
                                hue: (now / 4 + k * 40) % 360, size: 6 + Math.random() * 6, max: 0.9
                            });
                        }
                        state.clopT -= dt;
                        if (state.clopT <= 0 && state.alt < 2) {
                            state.clopT = 0.16;
                            playTone(Math.random() < 0.5 ? 900 : 700, 0.05, 0.06, 'triangle');
                        }
                    }
                    checkGems();
                } else {
                    state.x = state.targetX;
                    p.classList.remove('walking');
                    if (state.pending) {
                        const act = state.pending;
                        state.pending = null;
                        act();
                    }
                }
            } else {
                princessEl().classList.remove('walking');
            }

            // Altitude (flying unicorn)
            if (!state.busy) {
                state.alt += (state.targetAlt - state.alt) * Math.min(1, dt * 3);
                if (!state.flying && state.alt < 1) state.alt = 0;
            }
            if (state.flying) {
                state.flapT -= dt;
                if (state.flapT <= 0) {
                    state.flapT = 0.32;
                    playFreqSweep(260, 180, 0.12, 0.05);
                }
                if (Math.random() < 0.7) {
                    spawnSparkle(state.x - state.facing * 70, FEET_Y - 100 - state.alt + Math.random() * 40, {
                        vx: -state.facing * 40, vy: 20, g: 10, hue: (now / 4) % 360, size: 5 + Math.random() * 5, max: 1
                    });
                }
                checkSkyStars();
            }

            // Wand sparkles
            if (Math.random() < 0.35) {
                const wandX = state.x + state.facing * (0.38 * PRINCESS_W);
                const wandY = FEET_Y - PRINCESS_H + 0.36 * PRINCESS_H - (state.riding ? RIDE_LIFT : 0) - state.alt;
                spawnSparkle(wandX, wandY, { speed: 50, g: 30, size: 3 + Math.random() * 4, hue: 40 + Math.random() * 30 });
            }

            // Princess transform
            const p = princessEl();
            runTweens(now);
            const an = state.anim;
            p.style.transformOrigin = an.origin || '';
            const boatBob = state.boating ? Math.sin(now / 450) * 3 - BOAT_LIFT : 0;
            p.style.transform = `translate(${state.x - PRINCESS_W / 2 + an.dx}px, ${FEET_Y - PRINCESS_H - (state.riding ? RIDE_LIFT : 0) - state.alt + an.dy + boatBob}px) rotate(${an.rot}deg)`;
            updatePet(dt);
            p.classList.toggle('left', state.facing < 0);

            if (scene.key === 'out') {
                // Unicorn: carries the princess, or waits and looks at her
                const u = unicornEl();
                const ux = state.riding ? state.x : state.uniX;
                const uFacing = state.riding ? state.facing : (state.x < state.uniX ? -1 : 1);
                u.style.transform = `translate(${ux - UNICORN_W / 2}px, ${FEET_Y - UNICORN_H + 6 - (state.riding ? state.alt : 0)}px)`;
                u.classList.toggle('left', uFacing < 0);
                u.classList.toggle('walking', state.riding && p.classList.contains('walking'));
                updateBoat(now, p.classList.contains('walking'));

                // Fountain keeps spraying glitter water
                const boost = now < state.fountainBoost;
                if (Math.random() < (boost ? 1 : 0.5)) {
                    for (let k = 0; k < (boost ? 4 : 1); k++) {
                        spawnSparkle(700, 205, {
                            vx: (Math.random() - 0.5) * (boost ? 200 : 110),
                            vy: -(boost ? 260 : 130) - Math.random() * 60,
                            g: 380, hue: 185 + Math.random() * 30, size: 3 + Math.random() * 4, max: 1.1
                        });
                    }
                }
            }

            // Mirror reflection follows princess a little
            const refl = document.getElementById('reflection');
            if (refl && scene.key === 'in') {
                const off = Math.max(-45, Math.min(45, (state.x - (ROOM_W + 400)) * 0.25));
                refl.style.marginLeft = (-75 - off) + 'px';
            }

            // Camera
            let target = state.x - state.viewW / 2;
            if (state.viewW >= WORLD_W) target = (WORLD_W - state.viewW) / 2;
            else target = Math.max(0, Math.min(WORLD_W - state.viewW, target));
            state.camX += (target - state.camX) * Math.min(1, dt * 6);
            world.style.transform = `translate(${-state.camX * state.scale}px, ${state.offsetY}px) scale(${state.scale})`;

            // Room tracking
            const room = Math.max(0, Math.min(ROOMS.length - 1, Math.floor(state.x / ROOM_W)));
            if (room !== state.room) {
                state.room = room;
                roomPill.textContent = `${ROOMS[room].icon} ${ROOMS[room].name}`;
                roomPill.classList.add('bump');
                setTimeout(() => roomPill.classList.remove('bump'), 200);
                if (window.speechSynthesis) speechSynthesis.cancel();
                const say = ROOMS[room].say;
                setTimeout(() => speak(say), 60);
                playSparkleSound();
                updateBallroom();
            }
            updateTiles(now);

            updateParticles(dt, now);
            drawParticles(now);
            requestAnimationFrame(frame);
        }


        /* ─────────── Animations on the princess (swing, slide, bed) ─────────── */
        const tweens = [];
        function tween(dur, fn, done) {
            tweens.push({ t0: performance.now(), dur, fn, done });
        }
        function runTweens(now) {
            for (let i = tweens.length - 1; i >= 0; i--) {
                const tw = tweens[i];
                const t = Math.min(1, (now - tw.t0) / tw.dur);
                tw.fn(t, now);
                if (t >= 1) {
                    tweens.splice(i, 1);
                    if (tw.done) tw.done();
                }
            }
        }
        function resetAnim() {
            state.anim = { dx: 0, dy: 0, rot: 0, origin: '' };
        }
        const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

        function swingRide() {
            state.busy = true;
            state.facing = 1;
            const sw = state.swing;
            state.x = sw.x;
            const lift = -64;
            const princessTop = FEET_Y - PRINCESS_H + lift;
            state.anim = { dx: 0, dy: lift, rot: 0, origin: `${PRINCESS_W / 2}px ${sw.pivotY - princessTop}px` };
            speak('Wiiii! Schommelen!');
            let lastSign = 0;
            tween(6000, (t, now) => {
                const amp = 32 * Math.sin(Math.PI * Math.min(1, t * 1.3)) * (1 - t * 0.6);
                const rot = amp * Math.sin(t * Math.PI * 2 * 4);
                state.anim.rot = rot;
                sw.node.style.transform = `rotate(${rot}deg)`;
                const sign = Math.sign(Math.cos(t * Math.PI * 2 * 4));
                if (sign !== lastSign) {
                    lastSign = sign;
                    playFreqSweep(sign > 0 ? 400 : 600, sign > 0 ? 700 : 350, 0.25, 0.08);
                }
                if (Math.random() < 0.5) {
                    const a = rot * Math.PI / 180;
                    spawnSparkle(sw.x + Math.sin(a) * 150, sw.pivotY + Math.cos(a) * 150, { speed: 40, g: 20 });
                }
            }, () => {
                sw.node.style.transform = '';
                resetAnim();
                state.busy = false;
                sayRandom(['Nog een keer?', 'Dat was leuk!']);
            });
        }

        function slideRide() {
            state.busy = true;
            state.facing = 1;
            const topDy = -(FEET_Y - 176);
            const startX = state.x;
            speak('Klimmen maar!');
            tween(1400, (t) => {
                state.anim.dy = topDy * t + Math.sin(t * Math.PI * 8) * 4;
            }, () => {
                speak('Wieeee!');
                playFreqSweep(1200, 300, 0.9, 0.15);
                const endX = startX + 270;
                tween(1000, (t) => {
                    const e = ease(t);
                    state.x = startX + 40 + (endX - startX - 40) * e;
                    state.anim.dy = topDy * (1 - e);
                    state.anim.rot = 12 * Math.sin(Math.PI * t);
                    for (let k = 0; k < 2; k++) {
                        spawnSparkle(state.x - 30, FEET_Y - 40 + state.anim.dy, { vx: -80, vy: -30, g: 30, size: 6 });
                    }
                }, () => {
                    resetAnim();
                    state.targetX = state.x;
                    burst(state.x, 400, 40);
                    playCorrect();
                    state.busy = false;
                });
            });
        }

        function sleepInBed() {
            state.busy = true;
            state.facing = 1;
            const night = document.getElementById('night');
            const cover = document.getElementById('bedCover');
            speak('Welterusten prinses!');
            tween(600, (t) => {
                state.anim.rot = -90 * ease(t);
                state.anim.dy = -30 * ease(t);
            }, () => {
                cover.classList.add('show');
                night.classList.add('show');
                playLullaby();
                const zzzTimer = setInterval(() => {
                    const z = el('<div class="zzz">💤</div>');
                    place(z, state.x - 90, 280);
                    setTimeout(() => z.remove(), 2200);
                }, 900);
                setTimeout(() => {
                    clearInterval(zzzTimer);
                    night.classList.remove('show');
                    cover.classList.remove('show');
                    speak('Goedemorgen prinses! Kukeleku!');
                    playWin();
                    sparkleShower(state.x, 100, 60);
                    tween(600, (t) => {
                        state.anim.rot = -90 * (1 - ease(t));
                        state.anim.dy = -30 * (1 - ease(t));
                    }, () => {
                        resetAnim();
                        state.busy = false;
                    });
                }, 7000);
            });
        }

        function updatePet(dt) {
            const node = petEl();
            const pet = state.pet;
            if (pet.key !== scene.key) return;
            let moving = false;
            if (pet.following) {
                let target = state.x - state.facing * (state.riding ? 130 : 95);
                if (scene.key === 'out') target = Math.min(target, LAKE_X0 - 20);
                const d = target - pet.x;
                if (Math.abs(d) > 4) {
                    const step = d * Math.min(1, dt * 4);
                    pet.x += step;
                    pet.facing = Math.sign(d);
                    moving = Math.abs(step) > 0.6;
                }
                if (Math.random() < 0.01) spawnSparkle(pet.x, FEET_Y - 70, { hue: 340, speed: 40, g: -20 });
            }
            node.style.transform = `translate(${pet.x - 40}px, ${FEET_Y - 66}px)`;
            node.classList.toggle('right', pet.facing > 0);

        function nailSpark(x, y) {
            const icons = ['✨', '⭐', '💖', '🌟', '💫'];
            for (let i = 0; i < 8; i++) {
                const s = document.createElement('span');
                s.className = 'scope-spark';
                s.textContent = randomPick(icons);
                const a = Math.random() * Math.PI * 2;
                const d = 40 + Math.random() * 50;
                s.style.left = x + 'px';
                s.style.top = y + 'px';
                s.style.setProperty('--dx', Math.cos(a) * d + 'px');
                s.style.setProperty('--dy', Math.sin(a) * d + 'px');
                nailsEl.appendChild(s);
                setTimeout(() => s.remove(), 900);
            }
        }

        function nailCenter(i) {
            const f = handsSvg.querySelector(`.finger[data-nail="${i}"] rect:nth-of-type(2)`);
            const r = f.getBoundingClientRect();
            const o = nailsEl.getBoundingClientRect();
            return { x: r.left + r.width / 2 - o.left, y: r.top + r.height / 2 - o.top };
        }

        function nailSparkAll(n) {

        function paintNail(i, isTap) {
            const finger = handsSvg.querySelector(`.finger[data-nail="${i}"]`);
            if (!finger) return;
            if (nailTool.type === 'color') {
                if (nails[i].color === nailTool.value) return;
                nails[i].color = nailTool.value;
                const layer = finger.querySelector('.paint-layer');
                const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                r.setAttribute('x', -40); r.setAttribute('y', -200);
                r.setAttribute('width', 80); r.setAttribute('height', 260);
                r.setAttribute('fill', nailFill(nailTool.value));
                r.setAttribute('class', 'paint');
                layer.appendChild(r);
                if (nailTool.value === 'silver') {
                    const d = r.cloneNode();
                    d.setAttribute('fill', 'url(#nsilverDots)');
                    layer.appendChild(d);
                }
                while (layer.children.length > 3) layer.removeChild(layer.firstChild);
                finger.classList.add('painted');
                playFreqSweep(500 + i * 40, 900 + i * 40, 0.18, 0.1);
                const c = nailCenter(i);
                nailSpark(c.x, c.y);
                if (nails.every(n => n.color) && isTap !== 'drag-quiet') {
                    speak('Alle nagels gelakt!');
                } else if (Math.random() < 0.25) {
                    speak(randomPick(['Mooi!', 'Prachtig!', 'Wat glimt dat!']));
                }
            } else if (nailTool.type === 'ring') {
                if (!isTap) return;
                const slot = finger.querySelector('.ring-slot');
                if (nails[i].ring === nailTool.value) {
                    nails[i].ring = null;
                    slot.innerHTML = '';
                    playFreqSweep(1200, 600, 0.15, 0.1);
                    return;
                }
                nails[i].ring = nailTool.value;
                slot.innerHTML = `<g class="stk pop">${ringSVG(RINGS[nailTool.value], +slot.dataset.w)}</g>`;
                [1568, 2093, 2637].forEach((f, k) => setTimeout(() => playTone(f, 0.18, 0.08, 'sine'), k * 60));
                const r = slot.getBoundingClientRect();
                const o = nailsEl.getBoundingClientRect();
                nailSpark(r.left + r.width / 2 - o.left, r.top + r.height / 2 - o.top);
            } else if (nailTool.type === 'sticker') {
                if (nails[i].sticker === nailTool.value) return;
                nails[i].sticker = nailTool.value;
                const t = finger.querySelector('text.stk');
                t.textContent = nailTool.value;
                t.classList.remove('pop');
                void t.getBBox();
                t.classList.add('pop');
                playTone(1200, 0.12, 0.15, 'triangle');
                const c = nailCenter(i);
                nailSpark(c.x, c.y);
            }
        }

        function mixWhite(hex, amt) {
            if (!hex.startsWith('#')) return hex;
            const n = parseInt(hex.slice(1), 16);
            const mix = v => Math.round(v + (255 - v) * amt);
            const r = mix(n >> 16), g = mix((n >> 8) & 255), b = mix(n & 255);
            return `rgb(${r},${g},${b})`;
        }

            const o = teaEl.getBoundingClientRect();
            const x = r.left + r.width / 2 - o.left;
            const y = r.top + r.height / 3 - o.top;
            const icons = ['✨', '⭐', '💖', '🌟', '💫'];
            for (let i = 0; i < n; i++) {
                const s = document.createElement('span');
                s.className = 'scope-spark';
                s.textContent = randomPick(icons);
                const a = Math.random() * Math.PI * 2;
                const d = 50 + Math.random() * 60;
                s.style.left = x + 'px';
                s.style.top = y + 'px';
                s.style.setProperty('--dx', Math.cos(a) * d + 'px');
                s.style.setProperty('--dy', Math.sin(a) * d + 'px');
                teaEl.appendChild(s);
                setTimeout(() => s.remove(), 900);

        function toggleAcc(id) {
            const acc = CARE_ACCS.find(a => a.id === id);

        // Pointer → percentages inside the pet box, and pixels inside the stage
        function carePoint(e) {
            const b = petBox.getBoundingClientRect();
            const st = careStage.getBoundingClientRect();
            return {
                px: ((e.clientX - b.left) / b.width) * 100,
                py: ((e.clientY - b.top) / b.height) * 100,
                sx: e.clientX - st.left,
                sy: e.clientY - st.top
            };
        }

        function fxBit(cls, sx, sy, html, ms, vars) {
            const n = document.createElement('div');
            n.className = 'fx-bit ' + cls;
            n.style.left = sx + 'px';
            n.style.top = sy + 'px';
            if (html) n.innerHTML = html;
            if (vars) Object.entries(vars).forEach(([k, v]) => n.style.setProperty(k, v));
            careStage.appendChild(n);
            setTimeout(() => n.remove(), ms);
        }

        function twinkleAt(px, py, n) {
            const b = petBox.getBoundingClientRect();
            const st = careStage.getBoundingClientRect();
            for (let i = 0; i < n; i++) {
                const sx = b.left - st.left + (px / 100) * b.width + (Math.random() - 0.5) * 60;
                const sy = b.top - st.top + (py / 100) * b.height + (Math.random() - 0.5) * 60;
                fxBit('twinkle', sx, sy, randomPick(['✨', '⭐', '💖', '🌟']), 700);
            }
        }

        function near(item, pt, r) {
            return Math.hypot(item.x - pt.px, item.y - pt.py) < r;
        }

        function removeItem(list, item) {
            item.node.classList.add('gone');
            setTimeout(() => item.node.remove(), 350);
            list.splice(list.indexOf(item), 1);
        }

        function onPet(pt) {
            return pt.px > 5 && pt.px < 95 && pt.py > 0 && pt.py < 100;
        }

        function applyCareTool(e) {
            const pt = carePoint(e);
            toolCursor.style.left = pt.sx + 'px';
            toolCursor.style.top = pt.sy + 'px';
            const now = performance.now();
            const L = care.last;

            if (care.tool === 'soap') {
                if (!onPet(pt)) return;
                if (now - L.soap > 40 && care.foam.length < 90) {
                    L.soap = now;
                    const size = 7 + Math.random() * 7;
                    const x = pt.px + (Math.random() - 0.5) * 10, y = pt.py + (Math.random() - 0.5) * 10;
                    const f = document.createElement('div');
                    f.className = 'foam-b';
                    f.style.left = x + '%';
                    f.style.top = y + '%';
                    f.style.width = f.style.height = size + '%';
                    petLayer.appendChild(f);
                    care.foam.push({ x, y, node: f });
                }
                care.mud.forEach(m => {
                    if (!m.soapy && near(m, pt, 14)) {
                        m.soapy = true;
                        m.node.classList.add('soapy');
                    }
                });
                if (now - L.snd > 140) { L.snd = now; playFreqSweep(500 + Math.random() * 300, 900, 0.06, 0.06); }
            } else if (care.tool === 'shower') {
                if (now - L.spray > 45) {
                    L.spray = now;
                    for (let k = 0; k < 3; k++) {
                        fxBit('spray', pt.sx + (Math.random() - 0.5) * 40, pt.sy + 20, '', 500, { '--dx': ((Math.random() - 0.5) * 40) + 'px' });
                    }
                }
                if (!onPet(pt)) return;
                const below = { px: pt.px, py: pt.py + 8 };
                care.foam.slice().forEach(f => { if (near(f, below, 17)) removeItem(care.foam, f); });
                care.mud.slice().forEach(m => {
                    if (!near(m, below, 16)) return;
                    if (m.soapy) removeItem(care.mud, m);
                    else hintTool('soap');
                });
                if (now - L.drop > 90 && care.drops.length < 26) {
                    L.drop = now;
                    const x = Math.max(12, Math.min(88, below.px + (Math.random() - 0.5) * 24));
                    const y = Math.max(12, Math.min(85, below.py + (Math.random() - 0.5) * 24));
                    const d = document.createElement('div');
                    d.className = 'wet-drop';
                    d.style.left = x + '%';
                    d.style.top = y + '%';
                    petLayer.appendChild(d);
                    care.drops.push({ x, y, node: d });
                    care.wasWet = true;
                    care.dry = false;
                    petEmoji.classList.add('wet');
                }
            } else if (care.tool === 'dryer') {
                if (now - L.air > 50) {
                    L.air = now;
                    fxBit('air', pt.sx - 40, pt.sy + (Math.random() - 0.5) * 20, '', 450, { '--dy': ((Math.random() - 0.5) * 50) + 'px' });
                }
                if (!onPet({ px: pt.px + 12, py: pt.py })) return;
                const aim = { px: pt.px - 10, py: pt.py };
                care.drops.slice().forEach(d => { if (near(d, aim, 20)) removeItem(care.drops, d); });
                if (care.wasWet && !care.dry && care.drops.length === 0) {
                    care.dry = true;
                    petEmoji.classList.remove('wet');
                    petEmoji.classList.remove('fluffy');
                    void petEmoji.offsetWidth;
                    petEmoji.classList.add('fluffy');
                    twinkleAt(50, 45, 10);
                    CARE_PETS[care.pet].sound();
                }
            } else if (care.tool === 'brush') {
                if (!onPet(pt)) return;
                if (now - L.brush > 70) {
                    L.brush = now;
                    care.brushed++;
                    fxBit('twinkle', pt.sx + (Math.random() - 0.5) * 30, pt.sy, randomPick(['✨', '✨', '💫']), 700);
                    playTone(1400 + Math.random() * 800, 0.06, 0.05, 'sine');
                    if (care.brushed >= 30 && !care.shiny) {
                        care.shiny = true;
                        petEmoji.classList.add('shiny');
                        twinkleAt(50, 40, 12);
                        playSparkleSound();
                        wigglePet();
                    }
                }
            }
            checkClean();
        }

        function checkClean() {
            const clean = care.mud.length === 0 && care.foam.length === 0 && care.drops.length === 0;
            if (clean && !care.cleanShown) {
                care.cleanShown = true;
                document.getElementById('careDone').classList.add('pulse');
                wigglePet('jump');
                CARE_PETS[care.pet].sound();
                twinkleAt(50, 50, 12);
                playCorrect();
            }
        }

        function careDone() {
            if (care.mud.length) { hintTool('soap'); hintTool('shower'); wigglePet(); return; }
            if (care.foam.length) { hintTool('shower'); wigglePet(); return; }
            if (care.drops.length) { hintTool('dryer'); wigglePet(); return; }
            document.getElementById('careDone').classList.remove('pulse');
            care.done.add(care.pet);
            renderCarePets();
            wigglePet('jump');
            CARE_PETS[care.pet].sound();
            playWin();
            for (let k = 0; k < 3; k++) setTimeout(() => twinkleAt(50, 40, 12), k * 250);
            if (care.done.size === CARE_PETS.length) {
                setTimeout(() => {
                    playWin();
                    for (let k = 0; k < 5; k++) setTimeout(() => twinkleAt(Math.random() * 100, Math.random() * 100, 10), k * 200);
                }, 900);
            }
        }

        careStage.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            care.active = true;
            toolCursor.innerHTML = CARE_TOOLS.find(t => t.id === care.tool).icon;
            toolCursor.classList.add('show');
            if (care.tool === 'shower') startNoise('shower');
            if (care.tool === 'dryer') startNoise('dryer');
            applyCareTool(e);

        careStage.addEventListener('pointermove', (e) => {

        const careUp = () => {
            if (!care.active) return;

        // Looping filtered noise for the shower and the hair dryer
        let noise = null;
        function startNoise(kind) {
            stopNoise();
            try {
                const ctx = getAudioContext();
                const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

                filter.frequency.value = kind === 'shower' ? 2500 : 700;
                const gain = ctx.createGain();
                gain.gain.value = kind === 'shower' ? 0.05 : 0.07;
                src.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                src.start();
                noise = { src, gain, ctx };
            } catch (e) {}

        function setCell(i, c, animate) {
            if (emb.cells[i] === c) return false;

        function embCellAt(e) {
            const r = embSvg.getBoundingClientRect();
            const col = Math.floor(((e.clientX - r.left) / r.width) * EMB_N);
            const row = Math.floor(((e.clientY - r.top) / r.height) * EMB_N);
            if (col < 0 || row < 0 || col >= EMB_N || row >= EMB_N) return -1;
            return row * EMB_N + col;
        }

        function floodFill(start, c) {
            const target = emb.cells[start];
            if (target === c) return 0;
            const stack = [start];
            const seen = new Set();
            let n = 0;
            while (stack.length) {
                const i = stack.pop();
                if (seen.has(i) || emb.cells[i] !== target) continue;
                seen.add(i);
                setCell(i, c, true);
                n++;
                const x = i % EMB_N, y = Math.floor(i / EMB_N);
                if (x > 0) stack.push(i - 1);
                if (x < EMB_N - 1) stack.push(i + 1);
                if (y > 0) stack.push(i - EMB_N);
                if (y < EMB_N - 1) stack.push(i + EMB_N);
            }
            return n;
        }

        function embApply(e, isDown) {
            const i = embCellAt(e);

            if (emb.tool === 'fill') {
                if (!isDown) return;
                if (floodFill(i, emb.color)) {

                    embSpark(e.clientX, e.clientY, 10);

            } else if (emb.tool === 'erase') {
