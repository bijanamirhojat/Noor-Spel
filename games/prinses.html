<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#f472b6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Noor's Games">
    <title>Prinsessenkasteel</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
    <link rel="manifest" href="../manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        body {
            background: linear-gradient(135deg, #f9a8d4 0%, #c4b5fd 50%, #a5f3fc 100%);
            background-size: 300% 300%;
            animation: bodyShimmer 12s ease-in-out infinite;
        }

        @keyframes bodyShimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .game-container {
            max-width: 980px;
            height: calc(100vh - 30px);
            height: calc(100dvh - 30px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 14px;
        }

        h1 {
            margin-bottom: 6px;
            font-size: 1.5rem;
            color: #db2777;
            text-shadow: 2px 2px 0 #fbcfe8;
        }

        .back-btn {
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            background: #f472b6;
        }

        .back-btn:hover { background: #db2777; }

        .hud {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .pill {
            background: #fdf2f8;
            border: 2px solid #f9a8d4;
            color: #be185d;
            border-radius: 999px;
            padding: 4px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: transform 0.2s ease;
        }

        .pill.bump { transform: scale(1.25); }

        .playfield {
            position: relative;
            flex: 1;
            min-height: 0;
            border-radius: 26px;
            border: 3px solid #f9a8d4;
            overflow: hidden;
            background: #2e1065;
            cursor: pointer;
            touch-action: none;
        }

        .world {
            position: absolute;
            top: 0;
            left: 0;
            width: 4000px;
            height: 500px;
            transform-origin: 0 0;
        }

        #fx {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        /* ── Rooms ── */
        /* Rooms reach 500 units above the world so tall (iPad portrait) screens
           show extra wall instead of zooming in on half a room. */
        .room {
            position: absolute;
            top: -500px;
            width: 800px;
            height: 1000px;
            overflow: hidden;
        }

        .room .wall {
            position: absolute;
            inset: 0 0 100px 0;
        }

        .room .floor {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100px;
            box-shadow: inset 0 12px 18px rgba(0, 0, 0, 0.18);
        }

        .room-sign {
            position: absolute;
            top: 514px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            color: #be185d;
            font-family: 'Fredoka One', cursive;
            font-size: 22px;
            padding: 4px 18px;
            border-radius: 999px;
            border: 3px solid #fbcfe8;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 6;
        }

        .i-room.r0 .wall {
            background:
                repeating-linear-gradient(90deg, #fbcfe8 0 40px, #f9a8d4 40px 80px);
        }
        .i-room.r0 .floor {
            background: conic-gradient(#fdf2f8 25%, #f9a8d4 0 50%, #fdf2f8 0 75%, #f9a8d4 0) 0 0 / 50px 50px;
        }

        .i-room.r1 .wall {
            background:
                radial-gradient(circle, rgba(255,255,255,0.55) 3px, transparent 4px) 0 0 / 46px 46px,
                linear-gradient(180deg, #ddd6fe, #c4b5fd);
        }
        .i-room.r1 .floor {
            background: conic-gradient(#ede9fe 25%, #c4b5fd 0 50%, #ede9fe 0 75%, #c4b5fd 0) 0 0 / 50px 50px;
        }

        .i-room.r3 .wall {
            background:
                repeating-linear-gradient(90deg, #fecdd3 0 30px, #fda4af 30px 34px),
                #fecdd3;
        }
        .i-room.r3 .floor {
            background:
                linear-gradient(90deg, transparent 290px, #e11d48 290px 510px, transparent 510px),
                conic-gradient(#fef3c7 25%, #fcd34d 0 50%, #fef3c7 0 75%, #fcd34d 0) 0 0 / 50px 50px;
        }

        .i-room.r5 .wall {
            background: linear-gradient(180deg, #fff7ed 0%, #fdf2f8 55%, #ecfeff 100%);
        }
        .i-room.r5 .floor {
            background: conic-gradient(#ffffff 25%, #bae6fd 0 50%, #ffffff 0 75%, #fbcfe8 0) 0 0 / 50px 50px;
        }

        .i-room.r6 .wall {
            background:
                radial-gradient(circle at 20% 30%, #fff 1.5px, transparent 2.5px) 0 0 / 70px 60px,
                radial-gradient(circle at 70% 70%, #fde68a 1.5px, transparent 2.5px) 0 0 / 90px 80px,
                linear-gradient(180deg, #1e1b4b, #4c1d95);
        }
        .i-room.r6 .floor {
            background:
                repeating-linear-gradient(90deg, #7c3aed 0 60px, #6d28d9 60px 62px);
        }

        /* Pillars / doorways between rooms */
        .pillar {
            position: absolute;
            top: 0;
            width: 44px;
            height: 1000px;
            background: linear-gradient(90deg, #f5f5f4, #ffffff 40%, #e7e5e4);
            border-left: 3px solid #fde68a;
            border-right: 3px solid #fde68a;
            z-index: 2;
            box-shadow: 0 0 14px rgba(0,0,0,0.2);
        }

        .pillar::before {
            content: '';
            position: absolute;
            left: -10px;
            right: -10px;
            top: 500px;
            height: 28px;
            background: #fcd34d;
            border-radius: 0 0 10px 10px;
        }

        .pillar::after {
            content: '💖';
            position: absolute;
            top: 560px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
        }

        /* ── Objects (tappable) ── */
        .obj {
            position: absolute;
            cursor: pointer;
            z-index: 3;
            transition: transform 0.2s ease;
        }

        .obj.tap { animation: objTap 0.5s ease; }

        @keyframes objTap {
            0%, 100% { transform: scale(1); }
            40% { transform: scale(1.18) rotate(-4deg); }
            70% { transform: scale(0.95) rotate(3deg); }
        }

        .emoji-obj {
            font-size: 64px;
            line-height: 1;
            text-align: center;
            filter: drop-shadow(0 6px 6px rgba(0,0,0,0.2));
        }

        .gleam {
            animation: gleam 2.4s ease-in-out infinite;
        }

        @keyframes gleam {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(255,255,255,0.6)); }
            50% { filter: drop-shadow(0 0 16px rgba(255,236,153,1)); }
        }

        /* Torch */
        .torch {
            width: 30px;
            height: 110px;
        }
        .torch .stick {
            position: absolute;
            bottom: 0;
            left: 9px;
            width: 12px;
            height: 70px;
            background: linear-gradient(90deg, #fbbf24, #fde68a, #f59e0b);
            border-radius: 4px;
        }
        .torch .flame {
            position: absolute;
            bottom: 62px;
            left: 0;
            width: 30px;
            height: 44px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            background: radial-gradient(circle at 50% 70%, #fff 0 18%, #f0abfc 35%, #e879f9 60%, rgba(232,121,249,0) 72%);
            animation: flicker 0.6s ease-in-out infinite alternate;
            transform-origin: 50% 100%;
        }

        @keyframes flicker {
            from { transform: scale(1, 1) rotate(-3deg); }
            to { transform: scale(1.1, 1.18) rotate(3deg); }
        }

        /* Big door */
        .castle-door {
            width: 180px;
            height: 280px;
            border-radius: 90px 90px 0 0;
            background:
                repeating-linear-gradient(90deg, #a16207 0 30px, #854d0e 30px 34px);
            border: 8px solid #fcd34d;
            border-bottom: none;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
        }
        .castle-door::after {
            content: '';
            position: absolute;
            right: 30px;
            top: 150px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fde68a;
            box-shadow: 0 0 10px #fde68a;
        }

        .banner {
            width: 90px;
            height: 150px;
            background: linear-gradient(180deg, #a855f7, #7c3aed);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
            display: flex;
            justify-content: center;
            padding-top: 28px;
            font-size: 40px;
        }

        .frame {
            width: 120px;
            height: 140px;
            border: 10px solid #fbbf24;
            border-radius: 14px;
            background: linear-gradient(180deg, #bae6fd, #fbcfe8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.2), inset 0 0 0 4px #fde68a;
        }

        .rug {
            width: 240px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(ellipse, #f0abfc 0 30%, #c084fc 31% 55%, #f472b6 56% 100%);
            opacity: 0.9;
            z-index: 1;
            pointer-events: none;
        }

        /* Mirror */
        .mirror {
            width: 240px;
            height: 300px;
        }
        .mirror .glass {
            position: absolute;
            inset: 20px;
            border-radius: 50%;
            border: 12px solid #fcd34d;
            background: linear-gradient(135deg, #e0f2fe 0%, #f5d0fe 45%, #ffffff 55%, #cffafe 100%);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255,255,255,0.8), inset 0 0 30px rgba(255,255,255,0.8);
        }
        .mirror .glass::after {
            content: '';
            position: absolute;
            top: -40%;
            left: -60%;
            width: 40%;
            height: 180%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: rotate(25deg);
            animation: shine 3.5s ease-in-out infinite;
        }
        @keyframes shine {
            0%, 60% { left: -60%; }
            100% { left: 140%; }
        }
        .mirror.flash .glass {
            animation: mirrorFlash 0.6s ease;
        }
        @keyframes mirrorFlash {
            0%, 100% { filter: brightness(1); }
            30% { filter: brightness(1.9) saturate(1.5); }
        }
        .mirror .reflection {
            position: absolute;
            left: 50%;
            bottom: -70px;
            width: 150px;
            height: 240px;
            margin-left: -75px;
            transform: scaleX(-1);
            opacity: 0.92;
            transition: margin-left 0.15s linear;
        }
        .mirror .flower {
            position: absolute;
            font-size: 34px;
            line-height: 1;
            transform: translate(-50%, -50%);
            transition: transform 0.3s ease;
        }
        .mirror.flash .flower {
            animation: flowerSpin 0.8s ease;
        }
        @keyframes flowerSpin {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0); }
            50% { transform: translate(-50%, -50%) scale(1.5) rotate(180deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(360deg); }
        }

        .garland {
            position: absolute;
            top: 70px;
            height: 40px;
            font-size: 26px;
            letter-spacing: 6px;
            white-space: nowrap;
            pointer-events: none;
        }

        /* Throne */
        .throne {
            width: 170px;
            height: 250px;
        }
        .throne .back {
            position: absolute;
            left: 15px;
            top: 0;
            width: 140px;
            height: 170px;
            background: linear-gradient(180deg, #e11d48, #be123c);
            border: 10px solid #fbbf24;
            border-radius: 70px 70px 10px 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.25);
        }
        .throne .back::after {
            content: '👑';
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
        }
        .throne .seat {
            position: absolute;
            left: 0;
            top: 160px;
            width: 170px;
            height: 44px;
            background: linear-gradient(180deg, #fb7185, #e11d48);
            border: 8px solid #fbbf24;
            border-radius: 18px;
        }
        .throne .legs {
            position: absolute;
            left: 14px;
            right: 14px;
            top: 200px;
            height: 50px;
            border-left: 14px solid #f59e0b;
            border-right: 14px solid #f59e0b;
        }

        .chandelier {
            width: 150px;
            height: 110px;
        }
        .chandelier .chain {
            position: absolute;
            left: 73px;
            top: 0;
            width: 4px;
            height: 40px;
            background: #fbbf24;
        }
        .chandelier .body {
            position: absolute;
            left: 0;
            top: 40px;
            width: 150px;
            height: 30px;
            border-radius: 0 0 75px 75px;
            background: linear-gradient(180deg, #fde68a, #f59e0b);
        }
        .chandelier .candles {
            position: absolute;
            left: 0;
            top: 14px;
            width: 150px;
            display: flex;
            justify-content: space-around;
            font-size: 22px;
        }
        .chandelier .drops {
            position: absolute;
            left: 10px;
            right: 10px;
            top: 68px;
            display: flex;
            justify-content: space-around;
            font-size: 18px;
        }

        /* Rainbow room */
        .rainbow-window {
            width: 300px;
            height: 170px;
            border-radius: 150px 150px 0 0;
            border: 10px solid #fff;
            border-bottom: none;
            background:
                radial-gradient(circle at 50% 100%,
                    #bae6fd 0 30%,
                    #a855f7 30% 37%,
                    #3b82f6 37% 44%,
                    #22c55e 44% 51%,
                    #facc15 51% 58%,
                    #fb923c 58% 65%,
                    #ef4444 65% 72%,
                    #bae6fd 72%);
            box-shadow: 0 0 30px rgba(255,255,255,0.9);
            pointer-events: none;
        }

        .pedestal {
            width: 110px;
            height: 170px;
        }
        .pedestal .col {
            position: absolute;
            left: 25px;
            bottom: 0;
            width: 60px;
            height: 90px;
            background: linear-gradient(90deg, #f5f5f4, #fff, #e7e5e4);
            border-top: 8px solid #fcd34d;
            border-bottom: 8px solid #fcd34d;
        }
        .pedestal .ball {
            position: absolute;
            left: 10px;
            top: 0;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background:
                conic-gradient(from 0deg, #f472b6, #facc15, #4ade80, #60a5fa, #c084fc, #f472b6);
            box-shadow: 0 0 30px #f0abfc, inset -12px -12px 24px rgba(0,0,0,0.25), inset 12px 12px 24px rgba(255,255,255,0.7);
            animation: spinBall 6s linear infinite;
        }
        @keyframes spinBall { to { filter: hue-rotate(360deg); } }

        .discoball {
            width: 70px;
            height: 110px;
        }
        .discoball .chain {
            position: absolute;
            left: 33px;
            top: 0;
            width: 4px;
            height: 40px;
            background: #d4d4d8;
        }
        .discoball .ball {
            position: absolute;
            left: 0;
            top: 40px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background:
                repeating-linear-gradient(0deg, transparent 0 8px, rgba(0,0,0,0.15) 8px 9px),
                repeating-linear-gradient(90deg, transparent 0 8px, rgba(0,0,0,0.15) 8px 9px),
                radial-gradient(circle at 35% 35%, #fff, #d4d4d8 60%, #a1a1aa);
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
        }

        .rainbow-arc {
            position: absolute;
            left: 0;
            top: 0;
            width: 800px;
            height: 500px;
            pointer-events: none;
            z-index: 1;
        }
        .rainbow-arc path {
            fill: none;
            stroke-width: 22;
            stroke-linecap: round;
            stroke-dasharray: 1400;
            stroke-dashoffset: 1400;
        }
        .rainbow-arc.show path {
            animation: drawArc 1.6s ease forwards;
        }
        @keyframes drawArc { to { stroke-dashoffset: 0; } }

        .disco-light {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0;
            z-index: 1;
        }
        .party .disco-light {
            opacity: 0.55;
            animation: discoMove 2.2s ease-in-out infinite alternate;
        }
        @keyframes discoMove {
            0% { transform: translate(0, 0); }
            50% { transform: translate(180px, 60px); }
            100% { transform: translate(-120px, 120px); }
        }

        /* Tower room */
        .tower-window {
            width: 220px;
            height: 240px;
            border-radius: 110px 110px 0 0;
            border: 12px solid #a78bfa;
            border-bottom-width: 18px;
            background:
                radial-gradient(circle at 70% 30%, #fef9c3 0 22px, rgba(254,249,195,0.3) 23px 34px, transparent 35px),
                radial-gradient(circle at 20% 60%, #fff 1.5px, transparent 2.5px) 0 0 / 40px 36px,
                linear-gradient(180deg, #0c0a3e, #312e81);
            pointer-events: none;
        }
        .telescope {
            width: 150px;
            height: 190px;
        }
        .telescope .tube {
            position: absolute;
            left: 10px;
            top: 30px;
            width: 140px;
            height: 38px;
            border-radius: 12px 20px 20px 12px;
            background: linear-gradient(180deg, #fde68a, #f59e0b 60%, #b45309);
            transform: rotate(-28deg);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .telescope .tube::before {
            content: '';
            position: absolute;
            right: -8px;
            top: -6px;
            width: 22px;
            height: 50px;
            border-radius: 8px;
            background: #fcd34d;
        }
        .telescope .tube::after {
            content: '';
            position: absolute;
            left: 20px;
            top: 4px;
            width: 26px;
            height: 30px;
            border-radius: 6px;
            background: #ec4899;
        }
        .telescope .legs {
            position: absolute;
            left: 50px;
            top: 80px;
            width: 60px;
            height: 110px;
            background:
                linear-gradient(100deg, transparent 44%, #7c2d12 44% 52%, transparent 52%),
                linear-gradient(80deg, transparent 48%, #7c2d12 48% 56%, transparent 56%),
                linear-gradient(90deg, transparent 46%, #92400e 46% 54%, transparent 54%);
        }
        .tap-hint {
            position: absolute;
            top: -34px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            animation: hintBob 1.2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes hintBob {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -10px); }
        }

        /* ── Gems ── */
        .gem {
            position: absolute;
            width: 40px;
            height: 40px;
            margin-left: -20px;
            font-size: 34px;
            line-height: 40px;
            text-align: center;
            z-index: 4;
            pointer-events: none;
            animation: gemBob 1.6s ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.95));
        }
        .gem.got {
            animation: gemGot 0.5s ease forwards;
        }
        @keyframes gemBob {
            0%, 100% { transform: translateY(0) rotate(-6deg); }
            50% { transform: translateY(-12px) rotate(6deg); }
        }
        @keyframes gemGot {
            to { transform: translateY(-120px) scale(1.8); opacity: 0; }
        }

        /* ── Princess ── */
        .princess {
            position: absolute;
            left: 0;
            top: 0;
            width: 120px;
            height: 192px;
            z-index: 10;
            pointer-events: none;
        }
        .princess .flip {
            width: 100%;
            height: 100%;
            transition: transform 0.15s ease;
        }
        .princess.left .flip { transform: scaleX(-1); }
        .princess svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        .princess.walking .bob {
            animation: walkBob 0.36s ease-in-out infinite;
        }
        .princess.walking .skirt {
            animation: skirtSway 0.36s ease-in-out infinite alternate;
            transform-origin: 50px 80px;
        }
        @keyframes walkBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes skirtSway {
            from { transform: rotate(-3deg); }
            to { transform: rotate(3deg); }
        }
        .princess.sitting .bob {
            transform: translateY(-38px);
        }
        .princess.twirl .flip {
            animation: twirl 0.8s ease;
        }
        @keyframes twirl {
            0% { transform: scaleX(1); }
            25% { transform: scaleX(-1); }
            50% { transform: scaleX(1); }
            75% { transform: scaleX(-1); }
            100% { transform: scaleX(1); }
        }
        .wand-star {
            animation: wandTwinkle 1s ease-in-out infinite;
            transform-origin: 88px 58px;
        }
        @keyframes wandTwinkle {
            0%, 100% { transform: scale(1) rotate(0); }
            50% { transform: scale(1.3) rotate(20deg); }
        }

        /* ── Controls ── */
        .arrow {
            position: absolute;
            bottom: 14px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 4px solid #fff;
            background: linear-gradient(135deg, #f472b6, #a855f7);
            color: #fff;
            font-size: 30px;
            font-family: 'Fredoka One', cursive;
            z-index: 30;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
            cursor: pointer;
            touch-action: none;
        }
        .arrow:active { transform: scale(0.92); }

            0% { transform: translate(0, 20px); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: translate(30px, -50px); opacity: 0; }
        }
        .ball-guest {
            font-size: 56px;
            line-height: 1;
            transform-origin: 50% 100%;
        }
        .music .ball-guest { animation: guestDance 1.2s ease-in-out infinite; }
        @keyframes guestDance {
            0%, 100% { transform: translateY(0) rotate(0); }
            33% { transform: translateY(-16px) rotate(-10deg); }
            66% { transform: translateY(-4px) rotate(10deg); }
        }
        .ball-guest.cheer { animation: cheer 0.6s ease !important; }
        @keyframes cheer {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-40px) scale(1.2); }
        }
        .cannon { font-size: 60px; line-height: 1; }
        .garland-balloons {
            font-size: 34px;
            letter-spacing: 10px;
            white-space: nowrap;
            pointer-events: none;
        }

        /* Dance moves (princess + prince) */
        .dancer {
            width: 100%;
            height: 100%;
            transform-origin: 50% 100%;
        }
        .dancer.move-spin { animation: mvSpin 1s ease-in-out; }
        .dancer.move-jump { animation: mvJump 1s ease-in-out; }
        .dancer.move-sway { animation: mvSway 1.2s ease-in-out; }
        .dancer.move-cartwheel { animation: mvCartwheel 1s ease-in-out; transform-origin: 50% 55%; }
        .dancer.move-bow { animation: mvBow 1.2s ease-in-out; }
        @keyframes mvSpin {
            from { transform: perspective(400px) rotateY(0); }
            to { transform: perspective(400px) rotateY(720deg); }
        }
        @keyframes mvJump {
            0%, 50%, 100% { transform: translateY(0); }
            25% { transform: translateY(-70px); }
            75% { transform: translateY(-45px); }
        }
        @keyframes mvSway {
            0%, 100% { transform: rotate(0); }
            20% { transform: rotate(-14deg); }
            40% { transform: rotate(14deg); }
            60% { transform: rotate(-14deg); }
            80% { transform: rotate(14deg); }
        }
        @keyframes mvCartwheel {
            0% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-50px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
        @keyframes mvBow {
            0%, 100% { transform: rotate(0) scaleY(1); }
            40%, 60% { transform: rotate(14deg) translateY(12px) scaleY(0.92); }
        }
        .prince {
            position: absolute;
            left: 0; top: 0;
            width: 120px;
            height: 192px;
            z-index: 9;
            cursor: pointer;
        }
        .prince .pface { width: 100%; height: 100%; transition: transform 0.2s ease; }
        .prince.left .pface { transform: scaleX(-1); }
        .prince svg { width: 100%; height: 100%; overflow: visible; }
        .music .prince .pbody { animation: princeSway 1.2s ease-in-out infinite; transform-origin: 50px 150px; }
        @keyframes princeSway {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .dance-bar {
            position: absolute;
            left: 50%;
            top: 12px;
            transform: translateX(-50%);
            z-index: 30;
            display: none;
            gap: 8px;
            padding: 6px 10px;

            background: rgba(255,255,255,0.85);
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);

        .dance-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;

        .dance-btn:active { transform: scale(0.9); }
        @media (max-width: 620px) {

            h1 { font-size: 1.2rem; margin-top: 28px; }

    <script src="shared.js"></script>
    <script>
        // No voice in this game: sounds and glitter only
        speak = () => {};

        /* ─────────── Constants ─────────── */
        const WORLD_H = 500;
        const ROOM_W = 800;
        const ROOMS_IN = [
            { name: 'Kasteelhal',    icon: '🏰', say: 'De kasteelhal' },
            { name: 'Spiegelkamer',  icon: '🪞', say: 'De spiegelkamer' },
            { name: 'Nagelsalon',    icon: '💅', say: 'De nagelsalon' },

        // The princess is in one scene at a time; these follow the active scene.
        let ROOMS = ROOMS_IN;
        let WORLD_W = ROOM_W * ROOMS.length;
        const PRINCESS_W = 120;
        const PRINCESS_H = 192;
        const FEET_Y = 452;
        const SPEED = 280;
        const RIDE_SPEED = 540;
        const BALL_IDX = 4;
        const BALL_TILE_X0 = 150;
        const RIDE_LIFT = 30;
        const MIN_VIEW_W = 580;

        const DRESSES = ['#f472b6', '#a855f7', '#38bdf8', '#34d399', '#fbbf24', 'rainbow', '#fb7185'];

        const playfield = document.getElementById('playfield');
        const SCENES = {
            in:  { key: 'in',  rooms: ROOMS_IN,  el: document.getElementById('worldIn'),  gems: [], gemsGot: 0, gemCount: 18, door: null },
            out: { key: 'out', rooms: ROOMS_OUT, el: document.getElementById('worldOut'), gems: [], gemsGot: 0, gemCount: 12, door: null }
        };
        let scene = SCENES.in;
        let world = scene.el;
        const canvas = document.getElementById('fx');
        const ctx2d = canvas.getContext('2d');
        const toastEl = document.getElementById('toast');
        const gemPill = document.getElementById('gemPill');
        const roomPill = document.getElementById('roomPill');

        /* ─────────── State ─────────── */
        const state = {
            x: 400,
            targetX: 400,
            facing: 1,
            camX: 0,
            scale: 1,
            viewW: 800,
            offsetY: 0,
            hold: 0,
            pending: null,
            busy: false,

        /* ─────────── Princess SVG ─────────── */

                        <path class="dress" d="M38 78 Q30 110 12 146 Q50 160 88 146 Q70 110 62 78 Z" fill="#f472b6"/>
                        <path d="M12 146 Q18 140 24 147 Q30 140 37 148 Q43 141 50 149 Q57 141 63 148 Q70 140 76 147 Q82 140 88 146" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
                        <circle cx="34" cy="120" r="2" fill="#fff"/>

        function applyDress() {
            const color = DRESSES[state.dressIdx];
            document.querySelectorAll('svg[data-prefix]').forEach(svg => {
                const fill = color === 'rainbow' ? `url(#${svg.dataset.prefix}rb)` : color;
                svg.querySelectorAll('.dress').forEach(d => d.setAttribute('fill', fill));
            });
        }

        /* ─────────── Build world ─────────── */
        function el(html) {
            const t = document.createElement('template');
            t.innerHTML = html.trim();
            return t.content.firstElementChild;
        }

        function place(node, x, y) {
            node.style.position = 'absolute';
            node.style.left = x + 'px';
            node.style.top = y + 'px';
            world.appendChild(node);
            return node;
        }

        // Tappable object: princess walks to walkX, then action runs.
        function addObj(html, x, y, walkX, action) {
            const node = place(el(html), x, y);
            node.classList.add('obj');
            node.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                if (state.busy) return;
                node.classList.remove('tap');
                void node.offsetWidth;
                node.classList.add('tap');
                playPop();
                const r = node.getBoundingClientRect();
                const p = screenToWorld(r.left + r.width / 2, r.top + r.height / 3);
                burst(p.x, p.y, 14);
                walkTo(walkX, action ? () => action(node) : null);
            });
            return node;
        }

            ROOMS.forEach((room, i) => {
                const r = el(`<div class="room ${cls} r${i}"><div class="wall"></div>${extra}<div class="floor"></div>
                    <div class="room-sign">${room.icon} ${room.name}</div></div>`);
                r.style.left = i * ROOM_W + 'px';
                world.appendChild(r);
            });
        }

        function buildWorld() {
            buildRooms('i-room');
            for (let i = 1; i < ROOMS.length; i++) {
                place(el('<div class="pillar"></div>'), i * ROOM_W - 22, -500);
            }

            /* Room 0: Kasteelhal */
            const r0 = 0;
            place(el('<div class="door-sign">🌳 Naar buiten</div>'), r0 + 78, 78);

                walkX: r0 + 150,
                node: addObj('<div class="castle-door"><div class="tap-hint" style="top:90px">👇</div></div>', r0 + 60, 120, r0 + 150, (node) => goThroughDoor(node, 'out'))

            addObj('<div class="banner">👑</div>', r0 + 340, 60, r0 + 385, () => sayRandom(['Het kasteel van de prinses!', 'Hoera!']));

            place(el('<div class="rug"></div>'), r0 + 440, 425).classList.add('obj');


            /* Room 1: Spiegelkamer */
            const r1 = ROOM_W;
            const garland = '🌸🌷🌼🌸🌷🌼🌸🌷🌼🌸🌷🌼🌸🌷🌼🌸🌷🌼🌸🌷🌼🌸';
            place(el(`<div class="garland">${garland}</div>`), r1 + 20, 64);
            buildMirror(r1 + 280, 70);
            addObj('<div class="emoji-obj gleam">🌷</div>', r1 + 110, 370, r1 + 150, flowerPop);
            addObj('<div class="emoji-obj gleam">💐</div>', r1 + 620, 370, r1 + 650, flowerPop);
            addObj('<div class="emoji-obj" style="font-size:52px">🎀</div>', r1 + 90, 170, r1 + 120, () => sayRandom(['Een mooie strik!', 'Roze strik!']));

            /* Room 2: Troonzaal */
            const r2 = ROOM_W * 3;
            place(el('<div class="chandelier"><div class="chain"></div><div class="candles">🕯️🕯️🕯️</div><div class="body"></div><div class="drops">💎💎💎💎</div></div>'), r2 + 150, 20);
            place(el('<div class="chandelier"><div class="chain"></div><div class="candles">🕯️🕯️🕯️</div><div class="body"></div><div class="drops">💎💎💎💎</div></div>'), r2 + 500, 20);
            addObj('<div class="throne"><div class="back"></div><div class="seat"></div><div class="legs"></div><div class="tap-hint">👇</div></div>', r2 + 315, 200, r2 + 400, sitOnThrone);
            addObj('<div class="emoji-obj">🐶</div>', r2 + 620, 385, r2 + 610, dogBark);
            addObj('<div class="emoji-obj gleam" style="font-size:56px">🎂</div>', r2 + 90, 385, r2 + 130, () => { sayRandom(['Taart! Lekker!', 'Mmm, taart!']); playCorrect(); sparkleShower(r2 + 130, 380, 24); });

            /* Room 3: Regenboogzaal */
            const r3 = ROOM_W * 5;
            place(el('<div class="rainbow-window"></div>'), r3 + 250, 70);
            place(el(`<svg class="rainbow-arc" id="rainbowArc" viewBox="0 0 800 500">
                ${['#ef4444','#fb923c','#facc15','#4ade80','#60a5fa','#a855f7'].map((c, i) =>
                    `<path d="M ${60 + i * 22} 420 A ${340 - i * 22} ${320 - i * 22} 0 0 1 ${740 - i * 22} 420" stroke="${c}"/>`).join('')}
                </svg>`), r3, 0);
            ['#f472b6', '#60a5fa', '#facc15', '#4ade80'].forEach((c, i) => {
                const d = place(el(`<div class="disco-light" style="background:radial-gradient(circle, ${c}, transparent 70%)"></div>`), r3 + 80 + i * 170, 120 + (i % 2) * 90);
                d.style.animationDelay = (i * -0.5) + 's';
            });
            addObj('<div class="discoball"><div class="chain"></div><div class="ball"></div></div>', r3 + 590, 0, r3 + 560, rainbowParty);
            addObj('<div class="pedestal"><div class="ball"></div><div class="col"></div><div class="tap-hint">👇</div></div>', r3 + 345, 285, r3 + 290, rainbowParty);
            addObj('<div class="emoji-obj">🎈</div>', r3 + 90, 250, r3 + 120, balloonPop);
            addObj('<div class="emoji-obj">🎈</div>', r3 + 660, 230, r3 + 690, balloonPop);

            /* Room 4: Torenkamer */

        function mountUnicorn() {

        function dismountUnicorn(silent) {
            if (!state.riding) return;
            if (state.flying || state.alt > 1) setFlying(false, true);
            state.alt = state.targetAlt = 0;
            state.riding = false;
            state.uniX = state.x;
            princessEl().classList.remove('riding');
            unicornEl().classList.remove('ridden', 'walking');
            document.getElementById('rideBtns').classList.remove('show');
            state.x = state.targetX = Math.max(60, Math.min(WORLD_W - 60, state.x + (state.x > WORLD_W - 200 ? -90 : 90)));
            burst(state.x, 380, 30);
            if (!silent) speak('Dag eenhoorn!');
        }

        document.getElementById('dismount').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            dismountUnicorn(false);
        });

        function maxAlt() {
            const topY = -state.offsetY / state.scale;
            return Math.max(120, FEET_Y - PRINCESS_H - RIDE_LIFT - 20 - topY);
        }

        function setFlying(on, silent) {
            state.flying = on;
            const btns = document.getElementById('rideBtns');
            btns.classList.toggle('flying', on);
            document.getElementById('flyBtn').textContent = on ? '⬇️ Landen' : '✨ Vliegen';
            unicornEl().classList.toggle('flying', on);
            princessEl().classList.toggle('flying', on);
            if (on) {
                state.targetAlt = maxAlt() * 0.6;
                playFreqSweep(300, 1400, 0.6, 0.15);
                sparkleShower(state.x, 300, 60);
                if (!silent) speak('Vliegen! Omhoog! Tik in de lucht waar je heen wilt!');

                state.targetAlt = 0;
                if (!silent) {
                    playFreqSweep(1000, 300, 0.6, 0.12);
                    speak('Landen! Goed zo!');
                }
            }
        }

            const n = 10;
            star.x = 150 + (i + Math.random() * 0.7) * ((ROOM_W * ROOMS_OUT.length - 300) / n);

        function checkSkyStars() {
            const py = FEET_Y - 110 - state.alt;
            state.skyStars.forEach((star, i) => {
                if (star.got) return;
                if (Math.abs(star.x - state.x) < 60 && Math.abs(star.y - py) < 70) {
                    star.got = true;
                    star.node.classList.add('got');
                    burst(star.x, star.y, 36);
                    playSparkleSound();
                    if (Math.random() < 0.4) speak(randomPick(['Een ster gevangen!', 'Sterretje!', 'Hoera, een ster!']));
                    setTimeout(() => {
                        star.got = false;
                        star.node.classList.remove('got');
                        placeSkyStar(star, i);
                    }, 7000);
                }
            });
        }

        function walkTo(x, action) {
            state.targetX = Math.max(60, Math.min(WORLD_W - 60, x));
            state.pending = action;
            if (Math.abs(state.targetX - state.x) < 2 && action) {
                state.pending = null;
                action();
            }
        }

        function screenToWorld(clientX, clientY) {
            const r = playfield.getBoundingClientRect();
            return {
                x: state.camX + (clientX - r.left) / state.scale,
                y: (clientY - r.top - state.offsetY) / state.scale
            };
        }

        let dragId = null;
        playfield.addEventListener('pointerdown', (e) => {
            if (state.busy || overlayOpen()) return;
            const p = screenToWorld(e.clientX, e.clientY);
            burst(p.x, p.y, 10);
            walkTo(p.x, null);
            if (state.flying) state.targetAlt = Math.max(0, Math.min(maxAlt(), FEET_Y - 110 - p.y));
            dragId = e.pointerId;
        });
        playfield.addEventListener('pointermove', (e) => {
            if (e.pointerId !== dragId || state.busy || overlayOpen()) return;
            const p = screenToWorld(e.clientX, e.clientY);
            walkTo(p.x, null);
            if (state.flying) state.targetAlt = Math.max(0, Math.min(maxAlt(), FEET_Y - 110 - p.y));
            if (Math.random() < 0.4) spawnSparkle(p.x, p.y, { speed: 60 });
        });
        const endDrag = (e) => { if (e.pointerId === dragId) dragId = null; };
        playfield.addEventListener('pointerup', endDrag);
        playfield.addEventListener('pointercancel', endDrag);

        function bindHold(btn, dir) {
            const start = (e) => {
                e.preventDefault();
                e.stopPropagation();
                state.hold = dir;
                state.pending = null;
            };
            const stop = () => {
                if (state.hold === dir) {
                    state.hold = 0;
                    state.targetX = state.x;
                }
            };
            btn.addEventListener('pointerdown', start);
            btn.addEventListener('pointerup', stop);
            btn.addEventListener('pointerleave', stop);
            btn.addEventListener('pointercancel', stop);
        }
        bindHold(document.getElementById('btnLeft'), -1);
        bindHold(document.getElementById('btnRight'), 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { state.hold = -1; state.pending = null; }
            if (e.key === 'ArrowRight') { state.hold = 1; state.pending = null; }
            if (e.key === 'Escape' && scopeOpen) closeScope();
            if (e.key === 'Escape' && nailsOpen) closeNails();
            if (e.key === 'Escape' && teaOpen) closeTea();
        });
        document.addEventListener('keyup', (e) => {
            if ((e.key === 'ArrowLeft' && state.hold === -1) || (e.key === 'ArrowRight' && state.hold === 1)) {
                state.hold = 0;
                state.targetX = state.x;
            }
        });

        const MAX_PARTICLES = 500;

        function spawnSparkle(x, y, opts = {}) {
            if (particles.length >= MAX_PARTICLES) particles.shift();
            const a = Math.random() * Math.PI * 2;
            const sp = (opts.speed || 120) * (0.3 + Math.random() * 0.7);
            particles.push({
                x, y,
                vx: opts.vx !== undefined ? opts.vx : Math.cos(a) * sp,
                vy: opts.vy !== undefined ? opts.vy : Math.sin(a) * sp,
                g: opts.g !== undefined ? opts.g : 60,
                life: 0,
                max: opts.max || (0.7 + Math.random() * 0.9),
                size: opts.size || (4 + Math.random() * 7),
                hue: opts.hue !== undefined ? opts.hue : Math.random() * 360,
                spin: Math.random() * Math.PI,
                tw: Math.random() * 10
            });
        }

        function burst(x, y, n) {
            for (let i = 0; i < n; i++) spawnSparkle(x, y, { speed: 180 });
        }

        function sparkleShower(x, y, n) {
            for (let i = 0; i < n; i++) {
                spawnSparkle(x + (Math.random() - 0.5) * 300, y + Math.random() * 40, {
                    vx: (Math.random() - 0.5) * 40,
                    vy: 30 + Math.random() * 80,
                    g: 40,
                    max: 1.6 + Math.random() * 1.2
                });
            }
        }

        function drawStar(x, y, r, rot) {
            ctx2d.beginPath();
            for (let i = 0; i < 8; i++) {
                const rad = i % 2 === 0 ? r : r * 0.28;
                const a = rot + (i * Math.PI) / 4;
                ctx2d.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
            }
            ctx2d.closePath();
            ctx2d.fill();
        }

        function updateParticles(dt, now) {
            const party = now < state.partyUntil;

            // Ambient twinkles everywhere in view
            const ambient = party ? 6 : 1.2;
            for (let i = 0; i < ambient; i++) {
                if (Math.random() < ambient - i) {
                    spawnSparkle(state.camX + Math.random() * state.viewW, -state.offsetY / state.scale + Math.random() * (WORLD_H + state.offsetY / state.scale), {
                        vx: 0, vy: party ? 40 : -8, g: 0, speed: 0,
                        max: 0.8 + Math.random() * 0.8,
                        size: party ? 5 + Math.random() * 8 : 3 + Math.random() * 4
                    });
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life += dt;
                if (p.life >= p.max) { particles.splice(i, 1); continue; }
                p.vy += p.g * dt;
                p.vx *= 0.98;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.spin += dt * 2;
            }
        }

        function drawParticles(now) {
            const dpr = window.devicePixelRatio || 1;
            ctx2d.setTransform(1, 0, 0, 1, 0, 0);
            ctx2d.clearRect(0, 0, canvas.width, canvas.height);
            ctx2d.setTransform(dpr * state.scale, 0, 0, dpr * state.scale, -state.camX * state.scale * dpr, state.offsetY * dpr);
            ctx2d.globalCompositeOperation = 'lighter';
            for (const p of particles) {
                const t = p.life / p.max;
                const alpha = Math.sin(Math.PI * t) * (0.6 + 0.4 * Math.sin(now / 90 + p.tw));
                const s = p.size * (0.6 + 0.4 * Math.sin(now / 120 + p.tw));
                ctx2d.fillStyle = `hsla(${p.hue}, 100%, 72%, ${alpha})`;
                drawStar(p.x, p.y, s, p.spin);
                ctx2d.fillStyle = `rgba(255,255,255,${alpha * 0.9})`;
                drawStar(p.x, p.y, s * 0.45, p.spin);
            }
            ctx2d.globalCompositeOperation = 'source-over';
        }

        /* ─────────── Layout ─────────── */
        function resize() {
            const w = playfield.clientWidth;
            const h = playfield.clientHeight;
            state.scale = Math.min(h / WORLD_H, w / MIN_VIEW_W);
            state.viewW = w / state.scale;
            state.offsetY = h - WORLD_H * state.scale;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            if (scopeOpen) layoutScope();
        }
        window.addEventListener('resize', resize);
        if (window.ResizeObserver) new ResizeObserver(resize).observe(playfield);

        /* ─────────── Main loop ─────────── */
        function frame(now) {
            const dt = Math.min(0.05, (now - state.lastTime) / 1000);
            state.lastTime = now;

            if (!overlayOpen() && !state.busy) {
                if (state.hold) {
                    state.targetX = Math.max(60, Math.min(WORLD_W - 60, state.x + state.hold * 200));
                }
                const dx = state.targetX - state.x;
                const p = princessEl();
                const speed = state.riding ? RIDE_SPEED : SPEED;
                if (Math.abs(dx) > 1.5) {
                    const step = Math.sign(dx) * Math.min(Math.abs(dx), speed * dt);
                    state.x += step;
                    state.facing = Math.sign(dx);
                    p.classList.add('walking');
                    // Glitter trail from the skirt hem
                    if (Math.random() < 0.8) {
                        spawnSparkle(state.x - state.facing * 30 + (Math.random() - 0.5) * 40, FEET_Y - 10 - Math.random() * 30, {
                            vx: -state.facing * 30, vy: -20 - Math.random() * 30, g: 20, size: 3 + Math.random() * 5
                        });
                    }
                    if (state.riding) {
                        // Rainbow trail from the tail + clip-clop hooves
                        for (let k = 0; k < 3; k++) {
                            spawnSparkle(state.x - state.facing * 80, FEET_Y - 110 - state.alt + Math.random() * 50, {
                                vx: -state.facing * 60, vy: (Math.random() - 0.5) * 30, g: 0,
                                hue: (now / 4 + k * 40) % 360, size: 6 + Math.random() * 6, max: 0.9
                            });
                        }
                        state.clopT -= dt;
                        if (state.clopT <= 0 && state.alt < 2) {
                            state.clopT = 0.16;
                            playTone(Math.random() < 0.5 ? 900 : 700, 0.05, 0.06, 'triangle');
                        }
                    }
                    checkGems();
                } else {
                    state.x = state.targetX;
                    p.classList.remove('walking');
                    if (state.pending) {
                        const act = state.pending;
                        state.pending = null;
                        act();
                    }
                }
            } else {
                princessEl().classList.remove('walking');
            }

            // Altitude (flying unicorn)
            if (!state.busy) {
                state.alt += (state.targetAlt - state.alt) * Math.min(1, dt * 3);
                if (!state.flying && state.alt < 1) state.alt = 0;
            }
            if (state.flying) {
                state.flapT -= dt;
                if (state.flapT <= 0) {
                    state.flapT = 0.32;
                    playFreqSweep(260, 180, 0.12, 0.05);
                }
                if (Math.random() < 0.7) {
                    spawnSparkle(state.x - state.facing * 70, FEET_Y - 100 - state.alt + Math.random() * 40, {
                        vx: -state.facing * 40, vy: 20, g: 10, hue: (now / 4) % 360, size: 5 + Math.random() * 5, max: 1
                    });
                }
                checkSkyStars();
            }

            // Wand sparkles
            if (Math.random() < 0.35) {
                const wandX = state.x + state.facing * (0.38 * PRINCESS_W);
                const wandY = FEET_Y - PRINCESS_H + 0.36 * PRINCESS_H - (state.riding ? RIDE_LIFT : 0) - state.alt;
                spawnSparkle(wandX, wandY, { speed: 50, g: 30, size: 3 + Math.random() * 4, hue: 40 + Math.random() * 30 });
            }

            // Princess transform
            const p = princessEl();
            runTweens(now);
            const an = state.anim;
            p.style.transformOrigin = an.origin || '';
            p.style.transform = `translate(${state.x - PRINCESS_W / 2 + an.dx}px, ${FEET_Y - PRINCESS_H - (state.riding ? RIDE_LIFT : 0) - state.alt + an.dy}px) rotate(${an.rot}deg)`;
            updatePet(dt);
            p.classList.toggle('left', state.facing < 0);

            if (scene.key === 'out') {
                // Unicorn: carries the princess, or waits and looks at her
                const u = unicornEl();
                const ux = state.riding ? state.x : state.uniX;
                const uFacing = state.riding ? state.facing : (state.x < state.uniX ? -1 : 1);
                u.style.transform = `translate(${ux - UNICORN_W / 2}px, ${FEET_Y - UNICORN_H + 6 - (state.riding ? state.alt : 0)}px)`;
                u.classList.toggle('left', uFacing < 0);
                u.classList.toggle('walking', state.riding && p.classList.contains('walking'));

                // Fountain keeps spraying glitter water
                const boost = now < state.fountainBoost;
                if (Math.random() < (boost ? 1 : 0.5)) {
                    for (let k = 0; k < (boost ? 4 : 1); k++) {
                        spawnSparkle(700, 205, {
                            vx: (Math.random() - 0.5) * (boost ? 200 : 110),
                            vy: -(boost ? 260 : 130) - Math.random() * 60,
                            g: 380, hue: 185 + Math.random() * 30, size: 3 + Math.random() * 4, max: 1.1
                        });
                    }
                }
            }

            // Mirror reflection follows princess a little
            const refl = document.getElementById('reflection');
            if (refl && scene.key === 'in') {
                const off = Math.max(-45, Math.min(45, (state.x - (ROOM_W + 400)) * 0.25));
                refl.style.marginLeft = (-75 - off) + 'px';
            }

            // Camera
            let target = state.x - state.viewW / 2;
            if (state.viewW >= WORLD_W) target = (WORLD_W - state.viewW) / 2;
            else target = Math.max(0, Math.min(WORLD_W - state.viewW, target));
            state.camX += (target - state.camX) * Math.min(1, dt * 6);
            world.style.transform = `translate(${-state.camX * state.scale}px, ${state.offsetY}px) scale(${state.scale})`;

            // Room tracking
            const room = Math.max(0, Math.min(ROOMS.length - 1, Math.floor(state.x / ROOM_W)));
            if (room !== state.room) {
                state.room = room;
                roomPill.textContent = `${ROOMS[room].icon} ${ROOMS[room].name}`;
                roomPill.classList.add('bump');
                setTimeout(() => roomPill.classList.remove('bump'), 200);
                if (window.speechSynthesis) speechSynthesis.cancel();
                const say = ROOMS[room].say;
                setTimeout(() => speak(say), 60);
                playSparkleSound();
                updateBallroom();
            }
            updateTiles(now);

            updateParticles(dt, now);
            drawParticles(now);
            requestAnimationFrame(frame);
        }


        /* ─────────── Animations on the princess (swing, slide, bed) ─────────── */
        const tweens = [];
        function tween(dur, fn, done) {
            tweens.push({ t0: performance.now(), dur, fn, done });
        }
        function runTweens(now) {
            for (let i = tweens.length - 1; i >= 0; i--) {
                const tw = tweens[i];
                const t = Math.min(1, (now - tw.t0) / tw.dur);
                tw.fn(t, now);
                if (t >= 1) {
                    tweens.splice(i, 1);
                    if (tw.done) tw.done();
                }
            }
        }
        function resetAnim() {
            state.anim = { dx: 0, dy: 0, rot: 0, origin: '' };
        }
        const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

        function swingRide() {
            state.busy = true;
            state.facing = 1;
            const sw = state.swing;
            state.x = sw.x;
            const lift = -64;
            const princessTop = FEET_Y - PRINCESS_H + lift;
            state.anim = { dx: 0, dy: lift, rot: 0, origin: `${PRINCESS_W / 2}px ${sw.pivotY - princessTop}px` };
            speak('Wiiii! Schommelen!');
            let lastSign = 0;
            tween(6000, (t, now) => {
                const amp = 32 * Math.sin(Math.PI * Math.min(1, t * 1.3)) * (1 - t * 0.6);
                const rot = amp * Math.sin(t * Math.PI * 2 * 4);
                state.anim.rot = rot;
                sw.node.style.transform = `rotate(${rot}deg)`;
                const sign = Math.sign(Math.cos(t * Math.PI * 2 * 4));
                if (sign !== lastSign) {
                    lastSign = sign;
                    playFreqSweep(sign > 0 ? 400 : 600, sign > 0 ? 700 : 350, 0.25, 0.08);
                }
                if (Math.random() < 0.5) {
                    const a = rot * Math.PI / 180;
                    spawnSparkle(sw.x + Math.sin(a) * 150, sw.pivotY + Math.cos(a) * 150, { speed: 40, g: 20 });
                }
            }, () => {
                sw.node.style.transform = '';
                resetAnim();
                state.busy = false;
                sayRandom(['Nog een keer?', 'Dat was leuk!']);
            });
        }

        function slideRide() {
            state.busy = true;
            state.facing = 1;
            const topDy = -(FEET_Y - 176);
            const startX = state.x;
            speak('Klimmen maar!');
            tween(1400, (t) => {
                state.anim.dy = topDy * t + Math.sin(t * Math.PI * 8) * 4;
            }, () => {
                speak('Wieeee!');
                playFreqSweep(1200, 300, 0.9, 0.15);
                const endX = startX + 270;
                tween(1000, (t) => {
                    const e = ease(t);
                    state.x = startX + 40 + (endX - startX - 40) * e;
                    state.anim.dy = topDy * (1 - e);
                    state.anim.rot = 12 * Math.sin(Math.PI * t);
                    for (let k = 0; k < 2; k++) {
                        spawnSparkle(state.x - 30, FEET_Y - 40 + state.anim.dy, { vx: -80, vy: -30, g: 30, size: 6 });
                    }
                }, () => {
                    resetAnim();
                    state.targetX = state.x;
                    burst(state.x, 400, 40);
                    playCorrect();
                    state.busy = false;
                });
            });
        }

        function sleepInBed() {
            state.busy = true;
            state.facing = 1;
            const night = document.getElementById('night');
            const cover = document.getElementById('bedCover');
            speak('Welterusten prinses!');
            tween(600, (t) => {
                state.anim.rot = -90 * ease(t);
                state.anim.dy = -30 * ease(t);
            }, () => {
                cover.classList.add('show');
                night.classList.add('show');
                playLullaby();
                const zzzTimer = setInterval(() => {
                    const z = el('<div class="zzz">💤</div>');
                    place(z, state.x - 90, 280);
                    setTimeout(() => z.remove(), 2200);
                }, 900);
                setTimeout(() => {
                    clearInterval(zzzTimer);
                    night.classList.remove('show');
                    cover.classList.remove('show');
                    speak('Goedemorgen prinses! Kukeleku!');
                    playWin();
                    sparkleShower(state.x, 100, 60);
                    tween(600, (t) => {
                        state.anim.rot = -90 * (1 - ease(t));
                        state.anim.dy = -30 * (1 - ease(t));
                    }, () => {
                        resetAnim();
                        state.busy = false;
                    });
                }, 7000);
            });
        }

        function playLullaby() {
            // Altijd is Kortjakje ziek / Twinkle twinkle
            const notes = [523, 523, 784, 784, 880, 880, 784, 0, 698, 698, 659, 659, 587, 587, 523];
            notes.forEach((f, i) => { if (f) setTimeout(() => playTone(f, 0.4, 0.12, 'sine'), i * 420); });
        }

        function playMusicBox() {
            const notes = [784, 988, 1175, 988, 784, 988, 1175, 1568, 1175, 988, 784];
            notes.forEach((f, i) => setTimeout(() => playTone(f, 0.25, 0.1, 'triangle'), i * 160));
        }

        function teddyHug(node) {
            speak(randomPick(['Knuffel! Lieve beer!', 'Een dikke knuffel!']));
            const r = node.getBoundingClientRect();
            const p = screenToWorld(r.left + r.width / 2, r.top);
            for (let i = 0; i < 30; i++) spawnSparkle(p.x, p.y, { hue: 330 + Math.random() * 30, speed: 160 });
            playCorrect();
        }

        /* ─────────── Pet cat ─────────── */
        function petEl() { return document.getElementById('pet'); }

        function togglePet() {
            const pet = state.pet;
            pet.following = !pet.following;
            petEl().classList.toggle('following', pet.following);
            catMeow();
            if (pet.following) {
                speak('Poes gaat met je mee!');
                for (let i = 0; i < 20; i++) spawnSparkle(pet.x, FEET_Y - 50, { hue: 340, speed: 120 });
            } else {
                speak('Poes blijft hier. Dag poes!');
            }
        }

        function updatePet(dt) {
            const node = petEl();
            const pet = state.pet;
            if (pet.key !== scene.key) return;
            let moving = false;
            if (pet.following) {
                const target = state.x - state.facing * (state.riding ? 130 : 95);
                const d = target - pet.x;
                if (Math.abs(d) > 4) {
                    const step = d * Math.min(1, dt * 4);
                    pet.x += step;
                    pet.facing = Math.sign(d);
                    moving = Math.abs(step) > 0.6;
                }
                if (Math.random() < 0.01) spawnSparkle(pet.x, FEET_Y - 70, { hue: 340, speed: 40, g: -20 });
            }
            node.style.transform = `translate(${pet.x - 40}px, ${FEET_Y - 66}px)`;
            node.classList.toggle('right', pet.facing > 0);
            node.classList.toggle('walking', moving);
        }

        /* ─────────── Nagelsalon ─────────── */
        const nailsEl = document.getElementById('nails');
        const handsSvg = document.getElementById('hands');

        ];
        const STICKERS = [
