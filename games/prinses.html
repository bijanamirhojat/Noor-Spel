        function buildNailTools() {
            const palette = document.getElementById('palette');
            palette.innerHTML = NAIL_COLORS.map((c, i) =>
                `<button class="bottle-btn${i === 0 ? ' sel' : ''}" data-i="${i}" aria-label="${c.name}">
                    <span class="cap"></span><span class="glass" style="background:${c.css || c.c}"></span>
                </button>`).join('');
            const tools = document.getElementById('nailTools');
            tools.innerHTML = STICKERS.map((s, i) => `<button class="tool-btn" data-s="${i}">${s.s}</button>`).join('') +
                `<button class="tool-btn wide" id="glitterBtn">✨ Glitter</button>
                 <button class="tool-btn wide" id="wipeBtn">🧽 Weg</button>
                 <button class="tool-btn wide" id="doneBtn">✅ Klaar!</button>`;

            const selectBtn = (btn) => {
                nailsEl.querySelectorAll('.bottle-btn, .tool-btn[data-s]').forEach(b => b.classList.remove('sel'));
                btn.classList.add('sel');
            };
            palette.querySelectorAll('.bottle-btn').forEach(btn => {
                btn.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    const c = NAIL_COLORS[+btn.dataset.i];
                    nailTool = { type: 'color', value: c.c };
                    selectBtn(btn);
                    playPop();
                    if (window.speechSynthesis) speechSynthesis.cancel();
                    speak(c.name);
                });
            });
            tools.querySelectorAll('.tool-btn[data-s]').forEach(btn => {
                btn.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    const st = STICKERS[+btn.dataset.s];
                    nailTool = { type: 'sticker', value: st.s };
                    selectBtn(btn);
                    playPop();
                    if (window.speechSynthesis) speechSynthesis.cancel();
                    speak(st.name);
                });
            });
            document.getElementById('glitterBtn').addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                handsSvg.classList.toggle('glitter');
                playSparkleSound();
                speak(handsSvg.classList.contains('glitter') ? 'Glitter erop!' : 'Glitter eraf!');
                nailSparkAll(6);
            });
            document.getElementById('wipeBtn').addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                handsSvg.querySelectorAll('.paint-layer').forEach(l => l.innerHTML = '');
                handsSvg.querySelectorAll('.stk').forEach(t => t.textContent = '');
                handsSvg.querySelectorAll('.finger').forEach(f => f.classList.remove('painted'));
                handsSvg.classList.remove('glitter');
                nails.forEach(n => { n.color = null; n.sticker = null; });
                playFreqSweep(600, 200, 0.4, 0.15);
                speak('Alles weg! Opnieuw beginnen!');
            });
            document.getElementById('doneBtn').addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                nailsDone();
            });
        }

        function nailSpark(x, y) {
            const icons = ['✨', '⭐', '💖', '🌟', '💫'];
            for (let i = 0; i < 8; i++) {
                const s = document.createElement('span');
                s.className = 'scope-spark';
                s.textContent = randomPick(icons);
                const a = Math.random() * Math.PI * 2;
                const d = 40 + Math.random() * 50;
                s.style.left = x + 'px';
                s.style.top = y + 'px';
                s.style.setProperty('--dx', Math.cos(a) * d + 'px');
                s.style.setProperty('--dy', Math.sin(a) * d + 'px');
                nailsEl.appendChild(s);
                setTimeout(() => s.remove(), 900);
            }
        }

        function nailCenter(i) {
            const f = handsSvg.querySelector(`.finger[data-nail="${i}"] rect:nth-of-type(2)`);
            const r = f.getBoundingClientRect();
            const o = nailsEl.getBoundingClientRect();
            return { x: r.left + r.width / 2 - o.left, y: r.top + r.height / 2 - o.top };
        }

        function nailSparkAll(n) {
            nails.forEach((nl, i) => { if (nl.color || n > 6) { const c = nailCenter(i); nailSpark(c.x, c.y); } });
        }

        function paintNail(i, isTap) {
            const finger = handsSvg.querySelector(`.finger[data-nail="${i}"]`);
            if (!finger) return;
            if (nailTool.type === 'color') {
                if (nails[i].color === nailTool.value) return;
                nails[i].color = nailTool.value;
                const layer = finger.querySelector('.paint-layer');
                const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                r.setAttribute('x', -40); r.setAttribute('y', -200);
                r.setAttribute('width', 80); r.setAttribute('height', 260);
                r.setAttribute('fill', nailFill(nailTool.value));
                r.setAttribute('class', 'paint');
                layer.appendChild(r);
                if (nailTool.value === 'silver') {
                    const d = r.cloneNode();
                    d.setAttribute('fill', 'url(#nsilverDots)');
                    layer.appendChild(d);
                }
                while (layer.children.length > 3) layer.removeChild(layer.firstChild);
                finger.classList.add('painted');
                playFreqSweep(500 + i * 40, 900 + i * 40, 0.18, 0.1);
                const c = nailCenter(i);
                nailSpark(c.x, c.y);
                if (nails.every(n => n.color) && isTap !== 'drag-quiet') {
                    speak('Alle nagels gelakt!');
                } else if (Math.random() < 0.25) {
                    speak(randomPick(['Mooi!', 'Prachtig!', 'Wat glimt dat!']));
                }
            } else if (isTap) {
                nails[i].sticker = nailTool.value;
                const t = finger.querySelector('.stk');
                t.textContent = nailTool.value;
                t.classList.remove('pop');
                void t.getBBox();
                t.classList.add('pop');
                playTone(1200, 0.12, 0.15, 'triangle');
                const c = nailCenter(i);
                nailSpark(c.x, c.y);
            }
        }

        function fingerAt(e) {
            const hit = document.elementFromPoint(e.clientX, e.clientY);
            const f = hit && hit.closest && hit.closest('.finger');
            return f ? +f.dataset.nail : -1;
        }

        handsSvg.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            nailPainting = true;
            const i = fingerAt(e);
            if (i >= 0) paintNail(i, true);
        });
        handsSvg.addEventListener('pointermove', (e) => {
            if (!nailPainting || nailTool.type !== 'color') return;
            const i = fingerAt(e);
            if (i >= 0) paintNail(i, false);
        });
        window.addEventListener('pointerup', () => { nailPainting = false; });
        nailsEl.addEventListener('pointerdown', (e) => e.stopPropagation());

        function nailsDone() {
            if (!nails.some(n => n.color || n.sticker)) {
                speak('Kies eerst een kleurtje en tik op een nagel!');
                return;
            }
            playWin();
            speak('Wat een prachtige nagels! Even blazen... Klaar!');
            handsSvg.classList.remove('drying');
            void handsSvg.getBoundingClientRect();
            handsSvg.classList.add('drying');
            nailSparkAll(10);
            setTimeout(() => nailSparkAll(10), 500);
            setTimeout(() => handsSvg.classList.remove('drying'), 1600);
        }

        function openNails() {
            nailsOpen = true;
            nailsEl.classList.add('open');
            speak('De nagelsalon! Kies een kleurtje en tik op een nagel!');
            playSparkleSound();
        }

        function closeNails() {
            nailsOpen = false;
            nailsEl.classList.remove('open');
            _playWhoosh();
            if (nails.some(n => n.color)) {
                burst(state.x, 330, 40);
                sayRandom(['Wat een mooie nagels, prinses!', 'Glimmende nagels!']);
            }
        }
        document.getElementById('nailsClose').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            closeNails();
        });


        /* ─────────── Theehuisje ─────────── */
        const teaEl = document.getElementById('tea');
        const cupSvg = document.getElementById('cupSvg');
        const cupWrap = document.getElementById('cupWrap');
        const potWrap = document.getElementById('potWrap');
        const streamEl = document.getElementById('stream');
        let teaOpen = false;
        let teaTab = 'cup';
        let teaBusy = false;

        const CUPS = [
            { fill: '#f9a8d4', name: 'Het roze stippenkopje', dots: true },
            { fill: '#93c5fd', name: 'Het blauwe bloemenkopje', deco: '🌼' },
            { fill: 'url(#cgold)', name: 'Het gouden kopje', rim: '#fff' },
            { fill: 'url(#crb)', name: 'Het regenboogkopje' },
            { fill: '#ffffff', name: 'Het witte hartjeskopje', deco: '💖' },
            { fill: '#c4b5fd', name: 'Het paarse sterrenkopje', deco: '⭐' }
        ];
        const TEAS = [
            { c: '#c2410c', name: 'Gewone thee', short: 'Thee' },
            { c: '#f472b6', name: 'Aardbeienthee', short: 'Aardbei' },
            { c: '#4ade80', name: 'Muntthee', short: 'Munt' },
            { c: '#8b5cf6', name: 'Bosbessenthee', short: 'Bosbes' },
            { c: '#6b3a1e', name: 'Warme chocolademelk', short: 'Choco' },
            { c: 'url(#teaRb)', name: 'Regenboogthee', short: 'Regenboog', css: 'linear-gradient(90deg,#ef4444,#facc15,#4ade80,#60a5fa,#c084fc)' }
        ];
        const TOPPINGS = [
            { id: 'suiker', e: '🧊', name: 'Een suikerklontje' },
            { id: 'melk', e: '🥛', name: 'Een scheutje melk' },
            { id: 'honing', e: '🍯', name: 'Honing' },
            { id: 'citroen', e: '🍋', name: 'Een schijfje citroen' },
            { id: 'aardbei', e: '🍓', name: 'Een aardbei' },
            { id: 'slagroom', e: '🍦', name: 'Slagroom' },
            { id: 'hagelslag', e: '🎉', name: 'Hagelslag' },
            { id: 'marshmallow', e: '🍡', name: 'Marshmallows' },
            { id: 'bloem', e: '🌸', name: 'Een bloemetje' },
            { id: 'glitter', e: '✨', name: 'Glitter' },
            { id: 'koekje', e: '🍪', name: 'Een koekje' }
        ];
        const GUESTS = [
            { e: '🧸', name: 'Beer' },
            { e: '🐱', name: 'Poes' },
            { e: '🦄', name: 'Eenhoorn' },
            { e: '🐰', name: 'Konijn' }
        ];
        let cup = { design: 0, tea: null, tops: [] };

        function mixWhite(hex, amt) {
            if (!hex.startsWith('#')) return hex;
            const n = parseInt(hex.slice(1), 16);
            const mix = v => Math.round(v + (255 - v) * amt);
            const r = mix(n >> 16), g = mix((n >> 8) & 255), b = mix(n & 255);
            return `rgb(${r},${g},${b})`;
        }

        function cupBody(d) {
            const c = CUPS[d];
            let deco = '';
            if (c.dots) deco += `<path d="M40 62 L200 62 Q196 168 120 176 Q44 168 40 62 Z" fill="url(#cdots)" opacity=".85"/>`;
            if (c.deco) deco += [[82, 118], [120, 138], [158, 118]].map(([x, y]) => `<text x="${x}" y="${y}" font-size="24" text-anchor="middle" dominant-baseline="central">${c.deco}</text>`).join('');
            return `
                <ellipse cx="120" cy="184" rx="112" ry="16" fill="#fff" stroke="#f9a8d4" stroke-width="3"/>
                <ellipse cx="120" cy="182" rx="70" ry="8" fill="#fdf2f8"/>
                <path d="M196 86 q44 -2 38 36 q-6 30 -48 30" fill="none" stroke="${c.fill}" stroke-width="15" stroke-linecap="round"/>
                <path d="M196 86 q44 -2 38 36 q-6 30 -48 30" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="2"/>
                <path d="M40 62 L200 62 Q196 168 120 176 Q44 168 40 62 Z" fill="${c.fill}" stroke="rgba(0,0,0,0.12)" stroke-width="2"/>
                ${deco}
                <ellipse cx="120" cy="62" rx="80" ry="16" fill="#fff7ed" stroke="${c.rim || '#fcd34d'}" stroke-width="5"/>`;
        }

        function teaFill() {
            if (!cup.tea) return 'transparent';
            const t = TEAS[cup.tea];
            return cup.tops.includes('melk') ? mixWhite(t.c, 0.45) : t.c;
        }

        function renderCup(animateTop) {
            const has = id => cup.tops.includes(id);
            const surfaceTopY = 66;
            let tops = '';
            const it = (id, inner) => `<g class="top-item${animateTop === id ? ' drop' : ''}">${inner}</g>`;
            if (has('melk') && cup.tea) tops += it('melk', `<path class="swirl" d="M92 66 q14 -8 28 0 t28 0" stroke="#fff" stroke-width="4" fill="none" opacity=".85" stroke-linecap="round"/>`);
            if (has('honing')) tops += it('honing', `<path class="swirl" d="M100 64 q20 10 40 0 q-10 -8 -20 -2 q-6 4 0 6" stroke="#fbbf24" stroke-width="5" fill="none" stroke-linecap="round"/>`);
            if (has('suiker')) tops += it('suiker', `<g class="bob-item"><rect x="78" y="56" width="16" height="14" rx="3" fill="#fff" stroke="#e5e7eb"/><rect x="146" y="58" width="15" height="13" rx="3" fill="#fff" stroke="#e5e7eb"/></g>`);
            if (has('marshmallow')) tops += it('marshmallow', `<g class="bob-item"><rect x="100" y="52" width="18" height="16" rx="7" fill="#fbcfe8"/><rect x="122" y="54" width="18" height="15" rx="7" fill="#fff"/><rect x="112" y="46" width="17" height="15" rx="7" fill="#fff" stroke="#fbcfe8"/></g>`);
            if (has('slagroom')) tops += it('slagroom', `<g><circle cx="95" cy="56" r="17" fill="#fff"/><circle cx="145" cy="56" r="17" fill="#fff"/><circle cx="120" cy="48" r="22" fill="#fff"/><circle cx="120" cy="28" r="13" fill="#fff"/><path d="M120 12 q6 4 0 10" fill="#fff"/></g>`);
            if (has('hagelslag')) {
                const y0 = has('slagroom') ? 36 : 60;
                const cols = ['#ef4444', '#facc15', '#4ade80', '#60a5fa', '#c084fc', '#f472b6'];
                let sp = '';
                for (let i = 0; i < 16; i++) {
                    const x = 96 + (i * 37) % 50, y = y0 + (i * 13) % 20;
                    sp += `<rect x="${x}" y="${y}" width="8" height="3" rx="1.5" fill="${cols[i % cols.length]}" transform="rotate(${(i * 47) % 180} ${x + 4} ${y + 1.5})"/>`;
                }
                tops += it('hagelslag', sp);
            }
            if (has('bloem')) tops += it('bloem', `<text x="120" y="${has('slagroom') ? 16 : 56}" font-size="28" text-anchor="middle" dominant-baseline="central">🌸</text>`);
            if (has('glitter')) {
                let g = '';
                [[96, 62], [118, 70], [140, 60], [108, 56], [150, 68], [128, 50], [86, 68]].forEach(([x, y], i) => {
                    g += `<circle cx="${x}" cy="${y - (has('slagroom') ? 20 : 0)}" r="${2 + (i % 3)}" fill="#fff" class="gl-dot" style="animation: glTwinkle 0.8s ${-i * 0.2}s ease-in-out infinite alternate"/>`;
                });
                tops += it('glitter', g);
            }
            if (has('citroen')) tops += it('citroen', `<text x="196" y="58" font-size="34" text-anchor="middle" dominant-baseline="central">🍋</text>`);
            if (has('aardbei')) tops += it('aardbei', `<text x="46" y="54" font-size="32" text-anchor="middle" dominant-baseline="central">🍓</text>`);
            if (has('koekje')) tops += it('koekje', `<text x="30" y="178" font-size="34" text-anchor="middle" dominant-baseline="central">🍪</text>`);

            cupSvg.innerHTML = `${cupBody(cup.design)}
                <ellipse class="tea-surface${cup.tea ? '' : ' empty'}" cx="120" cy="${surfaceTopY}" rx="73" ry="12" fill="${teaFill()}"/>
                ${tops}
                <g class="spoon"><line x1="120" y1="66" x2="150" y2="-10" stroke="#d4d4d8" stroke-width="6" stroke-linecap="round"/>
                <ellipse cx="152" cy="-16" rx="7" ry="10" fill="#e4e4e7"/></g>`;
        }

        function renderPot() {
            document.getElementById('potSvg').innerHTML = `
                <path d="M40 78 Q4 60 6 40" stroke="#f472b6" stroke-width="14" fill="none" stroke-linecap="round"/>
                <path d="M122 62 q34 4 30 34 q-4 22 -30 22" stroke="#f472b6" stroke-width="12" fill="none"/>
                <ellipse cx="80" cy="96" rx="52" ry="46" fill="#f9a8d4" stroke="#ec4899" stroke-width="3"/>
                <path d="M34 96 Q80 116 126 96" stroke="#fff" stroke-width="5" fill="none"/>
                <text x="80" y="82" font-size="22" text-anchor="middle" dominant-baseline="central">🌸</text>
                <ellipse cx="80" cy="54" rx="34" ry="10" fill="#fbcfe8" stroke="#ec4899" stroke-width="3"/>
                <circle cx="80" cy="42" r="8" fill="#fcd34d"/>`;
        }

        function renderGuests() {
            document.getElementById('guests').innerHTML = GUESTS.map((g, i) =>
                `<button class="guest" data-g="${i}">${g.e}<span class="gname">${g.name}</span><span class="gcup">☕</span></button>`).join('');
            document.querySelectorAll('.guest').forEach(btn => {
                btn.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    serveTea(+btn.dataset.g, btn);
                });
            });
        }

        function renderTabs() {
            const tabs = [['cup', '☕ Kopje'], ['tea', '🫖 Thee'], ['tops', '🍓 Erin']];
            const el2 = document.getElementById('teaTabs');
            el2.innerHTML = tabs.map(([k, label]) => `<button class="tea-tab${teaTab === k ? ' active' : ''}" data-k="${k}">${label}</button>`).join('');
            el2.querySelectorAll('.tea-tab').forEach(b => b.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                teaTab = b.dataset.k;
                playPop();
                renderTabs();
                renderOpts();
            }));
        }

        function renderOpts() {
            const box = document.getElementById('teaOpts');
            if (teaTab === 'cup') {
                box.innerHTML = CUPS.map((c, i) => `<button class="tea-opt${cup.design === i ? ' sel' : ''}" data-i="${i}">
                    <svg viewBox="0 0 240 200">${cupBody(i)}</svg></button>`).join('');
                box.querySelectorAll('.tea-opt').forEach(b => b.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    chooseCup(+b.dataset.i);
                }));
            } else if (teaTab === 'tea') {
                box.innerHTML = TEAS.map((t, i) => `<button class="tea-opt${cup.tea === i ? ' sel' : ''}" data-i="${i}">
                    <span class="drop-dot" style="background:${t.css || t.c}"></span><small>${t.short}</small></button>`).join('');
                box.querySelectorAll('.tea-opt').forEach(b => b.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    pourTea(+b.dataset.i);
                }));
            } else {
                box.innerHTML = TOPPINGS.map((t, i) => `<button class="tea-opt${cup.tops.includes(t.id) ? ' sel' : ''}" data-i="${i}">${t.e}</button>`).join('') +
                    `<button class="tea-opt stir-btn" id="stirBtn">🥄<small>Roeren</small></button>`;
                box.querySelectorAll('.tea-opt[data-i]').forEach(b => b.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    addTopping(+b.dataset.i);
                }));
                document.getElementById('stirBtn').addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    stirTea();
                });
            }
        }

        function teaSpark(el2, n = 8) {
            const r = el2.getBoundingClientRect();
            const o = teaEl.getBoundingClientRect();
            const x = r.left + r.width / 2 - o.left;
            const y = r.top + r.height / 3 - o.top;
            const icons = ['✨', '⭐', '💖', '🌟', '💫'];
            for (let i = 0; i < n; i++) {
                const s = document.createElement('span');
                s.className = 'scope-spark';
                s.textContent = randomPick(icons);
                const a = Math.random() * Math.PI * 2;
                const d = 50 + Math.random() * 60;
                s.style.left = x + 'px';
                s.style.top = y + 'px';
                s.style.setProperty('--dx', Math.cos(a) * d + 'px');
                s.style.setProperty('--dy', Math.sin(a) * d + 'px');
                teaEl.appendChild(s);
                setTimeout(() => s.remove(), 900);
            }
        }

        function sayNow(text) {
            if (window.speechSynthesis) speechSynthesis.cancel();
            setTimeout(() => speak(text), 40);
        }

        function chooseCup(i) {
            if (teaBusy) return;
            cup.design = i;
            renderCup();
            playPop();
            teaSpark(cupWrap);
            sayNow(CUPS[i].name + '!');
            teaTab = 'tea';
            renderTabs();
            renderOpts();
        }

        function pourTea(i) {
            if (teaBusy) return;
            teaBusy = true;
            cup.tea = i;
            const t = TEAS[i];
            sayNow(t.name + '! Inschenken maar!');
            potWrap.classList.add('pour');
            const stage = document.getElementById('teaStage').getBoundingClientRect();
            setTimeout(() => {
                const pr = potWrap.getBoundingClientRect();
                const cr = cupWrap.getBoundingClientRect();
                const x = pr.left - stage.left + pr.width * 0.12;
                const y = pr.top - stage.top + pr.height * 0.42;
                const endY = cr.top - stage.top + cr.height * 0.32;
                streamEl.style.left = x + 'px';
                streamEl.style.top = y + 'px';
                streamEl.style.height = Math.max(20, endY - y) + 'px';
                streamEl.style.background = t.css || t.c;
                streamEl.classList.add('on');
                for (let k = 0; k < 5; k++) setTimeout(() => playFreqSweep(260 + k * 30, 420 + k * 40, 0.14, 0.12), k * 180);
            }, 450);
            setTimeout(() => renderCup(), 800);
            setTimeout(() => {
                streamEl.classList.remove('on');
                potWrap.classList.remove('pour');
                teaSpark(cupWrap, 10);
                teaBusy = false;
                teaTab = 'tops';
                renderTabs();
                renderOpts();
            }, 1600);
        }

        function addTopping(i) {
            if (teaBusy) return;
            const t = TOPPINGS[i];
            if (!cup.tea && !['koekje', 'citroen', 'aardbei'].includes(t.id)) {
                sayNow('Eerst thee inschenken!');
                teaTab = 'tea';
                renderTabs();
                renderOpts();
                return;
            }
            if (!cup.tops.includes(t.id)) cup.tops.push(t.id);
            renderCup(t.id);
            renderOpts();
            playTone(1000 + i * 60, 0.12, 0.14, 'triangle');
            if (t.id === 'glitter') playSparkleSound();
            teaSpark(cupWrap, 6);
            sayNow(t.name + '!');
        }

        function stirTea() {
            if (teaBusy || !cup.tea) {
                if (!cup.tea) sayNow('Eerst thee inschenken!');
                return;
            }
            teaBusy = true;
            cupSvg.classList.add('stirring');
            sayNow('Roeren, roeren, roeren!');
            for (let k = 0; k < 6; k++) setTimeout(() => playTone(2200 + (k % 2) * 300, 0.05, 0.08, 'sine'), k * 250);
            setTimeout(() => {
                cupSvg.classList.remove('stirring');
                teaBusy = false;
            }, 1550);
        }

        function serveTea(g, btn) {
            if (teaBusy) return;
            if (!cup.tea) {
                sayNow(GUESTS[g].name + ' wil graag thee! Kies eerst een kleurtje thee.');
                return;
            }
            teaBusy = true;
            const cr = cupWrap.getBoundingClientRect();
            const br = btn.getBoundingClientRect();
            const dx = (br.left + br.width / 2) - (cr.left + cr.width / 2);
            const dy = (br.top + br.height / 2) - (cr.top + cr.height / 2);
            cupWrap.style.transform = `translate(calc(-50% + ${dx}px), ${dy}px) scale(0.25)`;
            playFreqSweep(500, 900, 0.3, 0.12);
            setTimeout(() => {
                cupWrap.style.opacity = '0';
                btn.classList.remove('drink');
                void btn.offsetWidth;
                btn.classList.add('drink', 'served');
                playFreqSweep(900, 200, 0.5, 0.15);
                teaSpark(btn, 12);
                const yum = cup.tops.length >= 3 ? 'Mmm, wat een feestthee!' : 'Mmm, lekker!';
                sayNow(`${GUESTS[g].name} zegt: slurp slurp! ${yum}`);
            }, 620);
            setTimeout(() => {
                cup = { design: cup.design, tea: null, tops: [] };
                cupWrap.style.transition = 'none';
                cupWrap.style.transform = '';
                cupWrap.style.opacity = '';
                renderCup();
                void cupWrap.offsetWidth;
                cupWrap.style.transition = '';
                cupWrap.classList.remove('fresh');
                void cupWrap.offsetWidth;
                cupWrap.classList.add('fresh');
                teaBusy = false;
                teaTab = 'cup';
                renderTabs();
                renderOpts();
                if (document.querySelectorAll('.guest.served').length === GUESTS.length) {
                    playWin();
                    sayNow('Iedereen heeft thee! Theefeest!');
                    document.querySelectorAll('.guest').forEach((b, k) => setTimeout(() => teaSpark(b, 10), k * 150));
                    setTimeout(() => document.querySelectorAll('.guest').forEach(b => b.classList.remove('served')), 3000);
                }
            }, 2200);
        }

        function openTea() {
            teaOpen = true;
            teaEl.classList.add('open');
            cup = { design: cup.design, tea: null, tops: [] };
            teaTab = 'cup';
            renderCup();
            renderPot();
            renderGuests();
            renderTabs();
            renderOpts();
            speak('Welkom in het theehuisje! Kies een kopje!');
            playMusicBox();
        }

        function closeTea() {
            teaOpen = false;
            teaEl.classList.remove('open');
            _playWhoosh();
            sayRandom(['Dag theehuisje!', 'Dat was een lekker theefeest!']);
        }
        document.getElementById('teaClose').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            closeTea();
        });
        teaEl.addEventListener('pointerdown', (e) => e.stopPropagation());

        function overlayOpen() { return scopeOpen || nailsOpen || teaOpen; }

        /* ─────────── Verrekijker ─────────── */
        const scope = document.getElementById('scope');
        const panoBase = document.getElementById('panoBase');
        const panoZoom = document.getElementById('panoZoom');
        const lensWrap = document.getElementById('lensWrap');
        const ringL = document.getElementById('ringL');
        const ringR = document.getElementById('ringR');
        const findList = document.getElementById('findList');
        const ZOOM = 2.4;
        let scopeOpen = false;
        let lens = { x: 0, y: 0, r: 60 };

        const FINDS = [
            { e: '🦄', name: 'Een eenhoorn!', x: 16, y: 66, s: 22 },
            { e: '🐉', name: 'Een lieve draak!', x: 84, y: 24, s: 22 },
            { e: '🦋', name: 'Een vlinder!', x: 42, y: 58, s: 14 },
            { e: '🎈', name: 'Een ballon!', x: 62, y: 12, s: 16 },
            { e: '🐸', name: 'Een kikker!', x: 30, y: 88, s: 14 },
            { e: '🦢', name: 'Een zwaan!', x: 60, y: 80, s: 16 },
            { e: '🐰', name: 'Een konijntje!', x: 90, y: 72, s: 16 }
        ];

        function panoHTML() {
            let h = `<div class="sun"></div><div class="rb"></div>
                <div class="hill" style="left:-10%;top:55%;width:70%;height:70%;background:#86efac"></div>
                <div class="hill" style="left:40%;top:60%;width:80%;height:70%;background:#4ade80"></div>
                <div class="lake"></div>
                <span class="p" style="left:22%;top:18%;font-size:34px">☁️</span>
                <span class="p" style="left:74%;top:10%;font-size:28px">☁️</span>
                <span class="p" style="left:48%;top:30%;font-size:22px">☁️</span>
                <span class="p" style="left:50%;top:48%;font-size:36px">🏰</span>
                <span class="p" style="left:8%;top:78%;font-size:30px">🌳</span>
                <span class="p" style="left:74%;top:60%;font-size:26px">🌳</span>
                <span class="p" style="left:38%;top:72%;font-size:16px">🌼</span>
                <span class="p" style="left:24%;top:76%;font-size:14px">🌷</span>
                <span class="p" style="left:80%;top:88%;font-size:16px">🌸</span>
                <span class="p" style="left:95%;top:55%;font-size:26px">🌲</span>`;
            FINDS.forEach((f, i) => {
                h += `<span class="p find" data-i="${i}" style="left:${f.x}%;top:${f.y}%;font-size:${f.s}px">${f.e}</span>`;
            });
            return h;
        }

        function buildScope() {
            panoBase.innerHTML = panoHTML();
            panoZoom.innerHTML = panoHTML();
            findList.innerHTML = FINDS.map((f, i) => `<span data-i="${i}">${f.e}</span>`).join('');
        }

        function layoutScope() {
            const w = scope.clientWidth;
            const h = scope.clientHeight;
            lens.r = Math.max(50, Math.min(w, h) * 0.2);
            if (!lens.x) { lens.x = w / 2; lens.y = h / 2; }
            renderLens();
        }

        function renderLens() {
            const { x, y, r } = lens;
            const off = r * 0.92;
            const m = `radial-gradient(circle ${r}px at ${x - off}px ${y}px, #000 98%, transparent 100%), radial-gradient(circle ${r}px at ${x + off}px ${y}px, #000 98%, transparent 100%)`;
            lensWrap.style.webkitMaskImage = m;
            lensWrap.style.maskImage = m;
            panoZoom.style.transformOrigin = `${x}px ${y}px`;
            panoZoom.style.transform = `scale(${ZOOM})`;
            [[ringL, x - off], [ringR, x + off]].forEach(([ring, cx]) => {
                ring.style.left = cx + 'px';
                ring.style.top = y + 'px';
                ring.style.width = ring.style.height = (r * 2 + 16) + 'px';
            });
        }

        function openScope() {
            scopeOpen = true;
            scope.classList.add('open');
            lens.x = 0;
            layoutScope();
            speak('Kijk door de verrekijker! Wat zie je?');
            playFreqSweep(400, 1200, 0.3, 0.15);
        }

        function closeScope() {
            scopeOpen = false;
            scope.classList.remove('open');
            _playWhoosh();
        }

        function scopeSpark(x, y) {
            const icons = ['✨', '⭐', '💖', '🌟', '💫'];
            for (let i = 0; i < 10; i++) {
                const s = document.createElement('span');
                s.className = 'scope-spark';
                s.textContent = randomPick(icons);
                const a = Math.random() * Math.PI * 2;
                const d = 60 + Math.random() * 60;
                s.style.left = x + 'px';
                s.style.top = y + 'px';
                s.style.setProperty('--dx', Math.cos(a) * d + 'px');
                s.style.setProperty('--dy', Math.sin(a) * d + 'px');
                scope.appendChild(s);
                setTimeout(() => s.remove(), 900);
            }
        }

        function checkFinds() {
            const w = scope.clientWidth;
            const h = scope.clientHeight;
            if (!scopeOpen || !w || !h) return;
            // Points in the un-zoomed scene that sit under the finger and under each lens centre
            const off = (lens.r * 0.92) / ZOOM;
            const spots = [[lens.x, lens.y], [lens.x - off, lens.y], [lens.x + off, lens.y]];
            const reach = Math.max(22, (lens.r * 0.75) / ZOOM);
            FINDS.forEach((f, i) => {
                if (f.found) return;
                const bx = (f.x / 100) * w;
                const by = (f.y / 100) * h;
                // Where the item appears on screen inside the magnified lens
                const fx = lens.x + (bx - lens.x) * ZOOM;
                const fy = lens.y + (by - lens.y) * ZOOM;
                if (spots.some(([sx, sy]) => Math.hypot(bx - sx, by - sy) < reach)) {
                    f.found = true;
                    panoZoom.querySelector(`.find[data-i="${i}"]`).classList.add('found');
                    panoBase.querySelector(`.find[data-i="${i}"]`).classList.add('found');
                    findList.querySelector(`[data-i="${i}"]`).classList.add('found');
                    scopeSpark(fx, fy);
                    playCorrect();
                    speak(f.name);
                    if (FINDS.every(ff => ff.found)) {
                        setTimeout(() => {
                            playWin();
                            speak('Alles gevonden! Knap hoor!');
                            for (let k = 0; k < 4; k++) {
                                setTimeout(() => scopeSpark(Math.random() * w, Math.random() * h), k * 200);
                            }
                        }, 900);
                        setTimeout(() => {
                            FINDS.forEach((ff, j) => {
                                ff.found = false;
                                scope.querySelectorAll(`[data-i="${j}"]`).forEach(n => n.classList.remove('found'));
                            });
                            closeScope();
                            showToast('🔭 Alles gevonden! 🌟');
                            sparkleShower(state.x, 60, 60);
                        }, 3600);
                    }
                }
            });
        }

        function moveLens(e) {
            const r = scope.getBoundingClientRect();
            lens.x = e.clientX - r.left;
            lens.y = e.clientY - r.top;
            renderLens();
            checkFinds();
        }

        let scopeDown = false;
        scope.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (e.target.closest('.scope-close')) return;
            scopeDown = true;
            moveLens(e);
        });
        scope.addEventListener('pointermove', (e) => {
            if (scopeDown || e.pointerType === 'mouse') moveLens(e);
        });
        window.addEventListener('pointerup', () => { scopeDown = false; });
        document.getElementById('scopeClose').addEventListener('click', (e) => {
            e.stopPropagation();
            closeScope();
        });
        document.getElementById('scopeClose').addEventListener('pointerdown', (e) => e.stopPropagation());

        /* ─────────── Start ─────────── */
        setScene('out');
        buildOutside();
        spawnGems();
        setScene('in');
        buildWorld();
        buildScope();
        buildHands();
        buildNailTools();
        applyDress();
        spawnGems();
        resize();
        state.camX = Math.max(0, state.x - state.viewW / 2);
        requestAnimationFrame(frame);
    </script>
</body>
</html>
