<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#ff6b6b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Noor's Games">
    <title>Noor's Bommetjes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>">
    <link rel="manifest" href="../manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        .game-container {
            max-width: 720px;
            height: calc(100vh - 30px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 14px;
        }

        h1 {
            margin-bottom: 6px;
            font-size: 1.5rem;
        }

        .back-btn {
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
        }

        .hud {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .pill {
            background: #fff8ef;
            border: 2px solid #ffd8a8;
            color: #9c5f00;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .task {
            margin-bottom: 6px;
            padding: 7px 10px;
            font-size: 0.88rem;
            text-align: center;
            background: rgba(255,255,255,0.85);
            border-radius: 14px;
            color: #4b3a1a;
            font-weight: 700;
        }

        .cave {
            position: relative;
            flex: 1;
            min-height: 0;
            border-radius: 22px;
            border: 4px solid #3a2418;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 50%, #5a4030 0%, #3a2418 100%);
            box-shadow: inset 0 0 60px rgba(0,0,0,0.55);
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grid {
            display: grid;
            gap: 3px;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }

        .cell {
            position: relative;
            background: transparent;
            border: none;
            padding: 0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.9rem, 3.2vmin, 1.6rem);
            cursor: pointer;
            transition: transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .cell.stone {
            background: linear-gradient(145deg, #9ca3af 0%, #6b7280 60%, #4b5563 100%);
            box-shadow:
                inset 2px 2px 3px rgba(255,255,255,0.25),
                inset -2px -2px 4px rgba(0,0,0,0.35),
                0 2px 4px rgba(0,0,0,0.3);
            color: #2d2d2d;
        }

        .cell.stone::before {
            content: '';
            position: absolute;
            top: 18%;
            left: 22%;
            width: 26%;
            height: 18%;
            background: rgba(255,255,255,0.22);
            border-radius: 50%;
            filter: blur(1px);
        }

        .cell.dirt {
            background: radial-gradient(circle at 40% 35%, #6b4a30 0%, #3d2818 100%);
            box-shadow: inset 0 0 6px rgba(0,0,0,0.5);
        }

        .cell.gem {
            background: radial-gradient(circle at 40% 35%, #6b4a30 0%, #3d2818 100%);
            box-shadow: inset 0 0 6px rgba(0,0,0,0.5);
            animation: gemPulse 1.6s ease-in-out infinite;
        }

        @keyframes gemPulse {
            0%, 100% { box-shadow: inset 0 0 6px rgba(0,0,0,0.5), 0 0 0 rgba(110,231,183,0); }
            50%      { box-shadow: inset 0 0 6px rgba(0,0,0,0.5), 0 0 14px rgba(110,231,183,0.85); }
        }

        .cell .bomb {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1rem, 4vmin, 2rem);
            animation: bombShake 0.4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes bombShake {
            0%, 100% { transform: translate(0, 0) rotate(-3deg) scale(1); }
            25%      { transform: translate(1px, -1px) rotate(3deg) scale(1.05); }
            50%      { transform: translate(-1px, 1px) rotate(-2deg) scale(1.08); }
            75%      { transform: translate(1px, 1px) rotate(4deg) scale(1.05); }
        }

        .cell.exploding {
            animation: explodeFlash 0.55s ease-out;
        }

        @keyframes explodeFlash {
            0%   { background: #fff7cc; transform: scale(1); box-shadow: 0 0 24px #fde047; }
            40%  { background: #f97316; transform: scale(1.15); box-shadow: 0 0 32px #f97316; }
            100% { background: transparent; transform: scale(1); box-shadow: none; }
        }

        .boom-burst {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.4rem, 6vmin, 2.6rem);
            pointer-events: none;
            animation: boomBurst 0.6s ease-out forwards;
        }

        @keyframes boomBurst {
            0%   { transform: scale(0.3); opacity: 0; }
            30%  { transform: scale(1.4); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .gem-pop {
            position: absolute;
            font-size: clamp(1.4rem, 5vmin, 2.2rem);
            pointer-events: none;
            animation: gemPop 1.2s ease-out forwards;
            z-index: 5;
        }

        @keyframes gemPop {
            0%   { transform: translateY(0) scale(0.6); opacity: 0; }
            30%  { transform: translateY(-10px) scale(1.3); opacity: 1; }
            100% { transform: translateY(-60px) scale(1); opacity: 0; }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .control-btn {
            background: linear-gradient(135deg, #fb923c 0%, #f97316 100%);
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 10px 18px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 0 #c2410c, 0 6px 12px rgba(0,0,0,0.18);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .control-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c2410c, 0 3px 6px rgba(0,0,0,0.18);
        }

        .message {
            text-align: center;
            margin-top: 6px;
            min-height: 1.2em;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
            font-size: 0.9rem;
        }

        .cell.wrong {
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%      { transform: translateX(-3px); }
            75%      { transform: translateX(3px); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <a href="../index.html" class="back-btn">🏠 Terug</a>
        <h1>💣 Noor's Bommetjes</h1>

        <div class="hud">
            <div class="pill" id="stonesPill">Stenen: 0</div>
            <div class="pill" id="gemsPill">💎 0</div>
        </div>

        <div class="task">Tik op een leeg vakje om een bom te plaatsen!</div>

        <div class="cave" id="cave">
            <div class="grid" id="grid"></div>
        </div>

        <div class="controls">
            <button class="control-btn" id="resetBtn" type="button">🔄 Nieuw veld</button>
        </div>

        <div class="message" id="message">Boem! 💥</div>
    </div>

    <script src="shared.js"></script>
    <script>
        const COLS = 8;
        const ROWS = 11;
        const STONE_CHANCE = 0.72;
        const GEM_CHANCE = 0.12;
        const BOMB_FUSE_MS = 1500;
        const EXPLOSION_RADIUS = 1; // 3x3 around bomb

        const grid = document.getElementById('grid');
        const cave = document.getElementById('cave');
        const stonesPill = document.getElementById('stonesPill');
        const gemsPill = document.getElementById('gemsPill');
        const message = document.getElementById('message');
        const resetBtn = document.getElementById('resetBtn');

        let cells = [];        // {state: 'stone'|'dirt'|'gem'|'bomb', hasGem: bool}
        let stonesLeft = 0;
        let gemsCollected = 0;

        function idx(r, c) { return r * COLS + c; }

        function createBoard() {
            cells = [];
            stonesLeft = 0;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const isStone = Math.random() < STONE_CHANCE;
                    const hasGem = isStone && Math.random() < GEM_CHANCE;
                    cells.push({
                        state: isStone ? 'stone' : 'dirt',
                        hasGem
                    });
                    if (isStone) stonesLeft++;
                }
            }
        }

        function renderGrid() {
            grid.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;
            grid.innerHTML = '';
            cells.forEach((cell, i) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'cell ' + cell.state;
                btn.dataset.i = i;
                if (cell.state === 'stone') {
                    btn.textContent = randomStoneFace();
                }
                btn.addEventListener('click', () => handleClick(i, btn));
                grid.appendChild(btn);
            });
            updateHud();
        }

        function randomStoneFace() {
            const faces = ['', '', '', '', '·', '•'];
            return faces[Math.floor(Math.random() * faces.length)];
        }

        function updateHud() {
            stonesPill.textContent = `Stenen: ${stonesLeft}`;
            gemsPill.textContent = `💎 ${gemsCollected}`;
        }

        function cellEl(i) {
            return grid.children[i];
        }

        function shakeCell(el) {
            el.classList.add('wrong');
            setTimeout(() => el.classList.remove('wrong'), 320);
        }

        function handleClick(i, el) {
            const cell = cells[i];
            if (cell.state === 'stone') {
                playWrong();
                shakeCell(el);
                message.textContent = 'Daar staat een steen — kies een leeg vakje.';
                return;
            }
            if (cell.state === 'bomb') {
                // already a bomb here
                return;
            }
            placeBomb(i);
        }

        function placeBomb(i) {
            const cell = cells[i];
            cell.state = 'bomb';
            const el = cellEl(i);
            el.classList.remove('dirt', 'gem');
            const bombEl = document.createElement('span');
            bombEl.className = 'bomb';
            bombEl.textContent = '💣';
            el.appendChild(bombEl);
            playFreqSweep(400, 600, 0.15, 0.18);
            message.textContent = 'Boem komt eraan...';

            setTimeout(() => explode(i), BOMB_FUSE_MS);
        }

        function playBoomSound() {
            try {
                const ctx = getAudioContext();
                // Low rumble
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.connect(g); g.connect(ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.5);
                g.gain.setValueAtTime(0.4, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.55);
                osc.start();
                osc.stop(ctx.currentTime + 0.6);

                // Noise burst via buffer
                const bufferSize = ctx.sampleRate * 0.3;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let k = 0; k < bufferSize; k++) {
                    data[k] = (Math.random() * 2 - 1) * (1 - k / bufferSize);
                }
                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const ng = ctx.createGain();
                ng.gain.value = 0.35;
                noise.connect(ng); ng.connect(ctx.destination);
                noise.start();
            } catch(e) {}
        }

        function explode(centerIdx) {
            const cr = Math.floor(centerIdx / COLS);
            const cc = centerIdx % COLS;

            playBoomSound();
            message.textContent = 'BOEM! 💥';

            // Big burst overlay on center
            const centerEl = cellEl(centerIdx);
            const burst = document.createElement('span');
            burst.className = 'boom-burst';
            burst.textContent = '💥';
            centerEl.appendChild(burst);
            setTimeout(() => burst.remove(), 620);

            // Clear bomb state at center
            cells[centerIdx].state = 'dirt';
            cells[centerIdx].hasGem = false;
            centerEl.innerHTML = '';
            centerEl.className = 'cell dirt';
            centerEl.classList.add('exploding');
            setTimeout(() => centerEl.classList.remove('exploding'), 560);

            // Destroy in radius
            for (let dr = -EXPLOSION_RADIUS; dr <= EXPLOSION_RADIUS; dr++) {
                for (let dc = -EXPLOSION_RADIUS; dc <= EXPLOSION_RADIUS; dc++) {
                    const r = cr + dr;
                    const c = cc + dc;
                    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
                    if (dr === 0 && dc === 0) continue;
                    const i = idx(r, c);
                    destroyCell(i);
                }
            }

            updateHud();
            if (stonesLeft === 0) {
                playWin();
                message.textContent = 'Alles weg! Goed gedaan! ⭐';
                setTimeout(() => {
                    resetBoard();
                }, 1800);
            }
        }

        function destroyCell(i) {
            const cell = cells[i];
            const el = cellEl(i);
            el.classList.add('exploding');
            setTimeout(() => el.classList.remove('exploding'), 560);

            if (cell.state === 'stone') {
                stonesLeft--;
                if (cell.hasGem) {
                    gemsCollected++;
                    cell.hasGem = false;
                    spawnGemPop(el);
                }
                cell.state = 'dirt';
                el.className = 'cell dirt';
                el.innerHTML = '';
            } else if (cell.state === 'bomb') {
                // chain reaction!
                el.innerHTML = '';
                setTimeout(() => explode(i), 120);
            }
            // dirt/gem on dirt: nothing to do
        }

        function spawnGemPop(sourceEl) {
            const gem = document.createElement('span');
            gem.className = 'gem-pop';
            gem.textContent = '💎';
            const rect = sourceEl.getBoundingClientRect();
            const caveRect = cave.getBoundingClientRect();
            gem.style.left = `${rect.left - caveRect.left + rect.width / 2 - 16}px`;
            gem.style.top = `${rect.top - caveRect.top + rect.height / 2 - 16}px`;
            cave.appendChild(gem);
            setTimeout(() => gem.remove(), 1200);
            try { playFreqSweep(1200, 2000, 0.18, 0.2); } catch(e) {}
        }

        function resetBoard() {
            createBoard();
            renderGrid();
            message.textContent = 'Nieuw veld! Tik op leeg vakje.';
        }

        resetBtn.addEventListener('click', () => {
            playPop();
            resetBoard();
        });

        createBoard();
        renderGrid();
    </script>
</body>
</html>
