<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#ff6b6b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Noor's Games">
    <title>Noor's Speelgoed - Games</title>
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255,182,193,0.2) 0%, transparent 30%);
            pointer-events: none;
            z-index: 0;
            animation: floatBg 20s ease-in-out infinite;
        }

        @keyframes floatBg {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-2%, 2%); }
        }

        .floating-shape {
            position: fixed;
            font-size: 2rem;
            opacity: 0;
            z-index: 0;
            pointer-events: none;
            animation: floatMove 8s ease-in-out infinite, fadeInOut 5s ease-in-out infinite;
        }

        .shape-1 { top: 5%; left: 5%; animation-delay: 0s, 0s; }
        .shape-2 { top: 8%; right: 5%; animation-delay: 1s, 1.5s; }
        .shape-3 { top: 50%; left: 2%; animation-delay: 2s, 3s; }
        .shape-4 { top: 50%; right: 2%; animation-delay: 3s, 0.5s; }
        .shape-5 { bottom: 5%; left: 5%; animation-delay: 4s, 2s; }
        .shape-6 { bottom: 5%; right: 5%; animation-delay: 5s, 4s; }
        .shape-7 { top: 30%; left: 3%; animation-delay: 1.5s, 2.5s; }
        .shape-8 { bottom: 30%; right: 3%; animation-delay: 2.5s, 1s; }

        @keyframes floatMove {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-15px) rotate(5deg); }
            50% { transform: translateY(-5px) rotate(-5deg); }
            75% { transform: translateY(-20px) rotate(3deg); }
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            20%, 80% { opacity: 0.2; }
            50% { opacity: 0.4; }
        }

        .home-container {
            background: linear-gradient(145deg, rgba(255,255,255,0.95) 0%, rgba(255,245,245,0.95) 100%);
            border-radius: 32px;
            padding: 16px 12px;
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.25),
                0 0 0 1px rgba(255,255,255,0.5) inset;
            width: 100%;
            max-width: 900px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        @media (min-width: 768px) {
            .home-container {
                padding: 20px 22px 16px;
            }
        }

        .header {
            margin-bottom: 12px;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 50%, #ff9ff3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        @media (min-width: 768px) {
            h1 { font-size: 2.2rem; }
        }

        /* ── Hero: Prinsessenkasteel ── */
        .hero {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border-radius: 28px;
            padding: 14px 16px;
            margin-bottom: 14px;
            min-height: 120px;
            background:
                radial-gradient(circle at 15% 25%, rgba(255,255,255,.55) 0 3px, transparent 4px),
                radial-gradient(circle at 70% 18%, rgba(255,255,255,.6) 0 2px, transparent 3px),
                radial-gradient(circle at 88% 70%, rgba(255,255,255,.5) 0 3px, transparent 4px),
                radial-gradient(circle at 40% 80%, rgba(255,255,255,.45) 0 2px, transparent 3px),
                linear-gradient(135deg, #ffb6e1 0%, #e0a8ff 55%, #a8c8ff 100%);
            border: 5px solid #fff;
            box-shadow: 0 8px 24px rgba(197,108,240,.35), 0 0 0 3px #f5b8ff;
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hero:hover { transform: translateY(-4px) scale(1.01); }
        .hero:active { transform: scale(0.98); }

        .hero-castle {
            font-size: 4.2rem;
            line-height: 1;
            flex-shrink: 0;
            filter: drop-shadow(0 6px 6px rgba(120,40,160,.3));
            animation: heroBob 3s ease-in-out infinite;
        }

        @keyframes heroBob {
            50% { transform: translateY(-6px); }
        }

        .hero-body {
            flex: 1;
            min-width: 0;
        }

        .hero-title {
            font-family: 'Fredoka One', cursive;
            font-size: 1.3rem;
            color: #7a2a8f;
            text-shadow: 0 2px 0 rgba(255,255,255,.7);
        }

        .hero-worlds {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .hero-world {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255,255,255,.7);
            border: 3px solid #fff;
            display: grid;
            place-items: center;
            font-size: 1.5rem;
        }

        .hero-crown,
        .hero-spark {
            position: absolute;
            display: none;
            animation: heroTwinkle 2.4s ease-in-out infinite;
        }

        .hero-crown { right: 20px; top: 12px; font-size: 2.2rem; }
        .hero-spark { right: 70px; bottom: 16px; font-size: 1.4rem; animation-delay: 0.6s; }

        @keyframes heroTwinkle {
            50% { transform: scale(1.25) rotate(10deg); opacity: .7; }
        }

        @media (min-width: 701px) {
            .hero { padding: 16px 24px; gap: 22px; min-height: 140px; }
            .hero-castle { font-size: 5.5rem; }
            .hero-title { font-size: 1.7rem; }
            .hero-world { width: 58px; height: 58px; font-size: 1.9rem; }
            .hero-crown, .hero-spark { display: block; }
        }

        /* ── Theme rows ── */
        .theme {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            align-items: center;
            border-radius: 24px;
            padding: 10px;
            margin-bottom: 10px;
            background: var(--tint);
        }

        .theme-badge {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 1.4rem;
            background: var(--solid);
            box-shadow: 0 3px 0 var(--dark);
        }

        .theme-dieren { --tint: #e3f8ec; --solid: #6ee7b7; --dark: #10b981; }
        .theme-maken  { --tint: #fff3d6; --solid: #ffd166; --dark: #f0a500; }
        .theme-thuis  { --tint: #e2f0ff; --solid: #74b9ff; --dark: #0984e3; }
        .theme-puzzel { --tint: #f0eaff; --solid: #b9a7ff; --dark: #6c5ce7; }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
        }

        .game-card {
            position: relative;
            overflow: hidden;
            background: #fff;
            border-radius: 16px;
            border: 3px solid var(--solid);
            min-height: 70px;
            display: grid;
            place-items: center;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(0,0,0,.08);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .game-card:hover { transform: translateY(-4px) scale(1.04); }
        .game-card:active { transform: scale(0.96); }

        .game-icon {
            font-size: 1.9rem;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.15));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .game-card:hover .game-icon {
            animation: bounce 0.5s ease infinite;
        }

        @media (min-width: 701px) {
            .theme {
                grid-template-columns: 64px minmax(0, 1fr);
                gap: 12px;
                padding: 10px 12px;
            }
            .theme-badge {
                width: 64px;
                height: 64px;
                border-radius: 20px;
                font-size: 2.1rem;
                box-shadow: 0 4px 0 var(--dark);
            }
            .theme-grid {
                grid-template-columns: repeat(6, minmax(0, 1fr));
                gap: 10px;
            }
            .game-card {
                min-height: 86px;
                border-radius: 18px;
                border-width: 4px;
            }
            .game-icon { font-size: 2.2rem; }
        }

        @media (min-width: 1024px) {
            .game-card { min-height: 96px; }
            .game-icon { font-size: 2.5rem; }
        }

        .footer {
            font-size: 0.6rem;
            color: #ccc;
            margin-top: 6px;
        }

        .update-banner {
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: 12px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.96);
            border: 2px solid #ffd2d2;
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.2);
            padding: 10px;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.8rem;
            color: #555;
        }

        .update-banner.show {
            display: flex;
        }

        .update-banner button {
            border: none;
            border-radius: 12px;
            padding: 8px 12px;
            font-family: 'Fredoka One', cursive;
            font-size: 0.78rem;
            cursor: pointer;
            color: white;
            background: linear-gradient(180deg, #ff7d7d 0%, #e84d4d 100%);
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .update-banner {
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                width: min(560px, calc(100vw - 40px));
                font-size: 0.9rem;
                padding: 12px 14px;
            }

            .update-banner button {
                font-size: 0.85rem;
                padding: 10px 16px;
                border-radius: 14px;
            }
        }

        /* ── Circular wipe game transition ── */
        #gameTransition {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            clip-path: circle(0% at 50% 50%);
        }
        #gameTransition.active {
            display: flex;
            animation: circularWipe 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        #gameTransition .trans-emoji {
            font-size: 5rem;
            animation: emojiBounceTrans 0.5s ease-out 0.15s both;
        }
        @keyframes circularWipe {
            from { clip-path: circle(0% at 50% 50%); }
            to   { clip-path: circle(150% at 50% 50%); }
        }
        @keyframes emojiBounceTrans {
            0%   { transform: scale(0) rotate(-15deg); opacity: 0; }
            60%  { transform: scale(1.3) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* ── Staggered card entrance ── */
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(18px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .card-enter {
            opacity: 0;
            animation: cardFadeIn 0.35s ease-out forwards;
        }

        /* ── Card shimmer (idle gloss sweep) ── */
        @keyframes shimmerSweep {
            0%   { left: -100%; }
            100% { left: 200%; }
        }
        .game-card::after,
        .hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            pointer-events: none;
            animation: shimmerSweep 4s ease-in-out infinite;
            animation-delay: inherit;
        }

        /* ── Splash screen ── */
        #splashScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.5s ease-out;
        }
        #splashScreen.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        #splashScreen .splash-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            color: white;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            gap: 2px;
            position: relative;
        }
        @media (min-width: 768px) {
            #splashScreen .splash-title { font-size: 3.5rem; }
        }
        #splashScreen .splash-letter {
            opacity: 0;
            transform: scale(0.3) translateY(20px);
            display: inline-block;
            transition: opacity 0.15s ease-out, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #splashScreen .splash-letter.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        /* Sparkle particles */
        #splashScreen .sparkle {
            position: absolute;
            font-size: 1.2rem;
            pointer-events: none;
            opacity: 0;
            animation: sparkleFloat 0.8s ease-out forwards;
        }
        @keyframes sparkleFloat {
            0%   { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0.2) rotate(180deg); }
        }
    </style>
</head>
<body>
    <!-- Splash screen (first visit per session) -->
    <div id="splashScreen" style="display:none;">
        <div class="splash-title" id="splashTitle"></div>
    </div>

    <!-- Game transition overlay (circular wipe) -->
    <div id="gameTransition">
        <span class="trans-emoji" id="transEmoji"></span>
    </div>

    <div class="floating-shape shape-1">⭐</div>
    <div class="floating-shape shape-2">🎈</div>
    <div class="floating-shape shape-3">🌈</div>
    <div class="floating-shape shape-4">🎀</div>
    <div class="floating-shape shape-5">🌸</div>
    <div class="floating-shape shape-6">🎨</div>
    <div class="floating-shape shape-7">🦋</div>
    <div class="floating-shape shape-8">✨</div>
    
    <div class="home-container" id="homeContainer">
        <div class="header">
            <h1>Noor's Games</h1>
        </div>

        <div class="hero" onclick="playGame('prinses')">
            <div class="hero-castle">🏰</div>
            <div class="hero-body">
                <div class="hero-title">Prinsessenkasteel</div>
                <div class="hero-worlds">
                    <div class="hero-world">👸</div>
                    <div class="hero-world">🌈</div>
                    <div class="hero-world">🧜‍♀️</div>
                </div>
            </div>
            <div class="hero-crown">👑</div>
            <div class="hero-spark">✨</div>
        </div>

        <div id="themes"></div>

        <div class="footer" id="releaseBadge"></div>
    </div>

    <div class="update-banner" id="updateBanner" role="status" aria-live="polite">
        <span id="updateBannerText">Nieuwe versie beschikbaar</span>
        <button type="button" id="updateNowBtn">Nu updaten</button>
    </div>

    <script>
        const RELEASE_ID = '20260308-090358-4b1234b';

        /* ── Audio helpers (index.html doesn't load shared.js) ── */
        let _audioCtx = null;
        function getAudioContext() {
            if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (_audioCtx.state === 'suspended') _audioCtx.resume();
            return _audioCtx;
        }
        function playFreqSweep(startF, endF, dur = 0.1, vol = 0.2) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.connect(g); g.connect(ctx.destination);
                osc.frequency.setValueAtTime(startF, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(endF, ctx.currentTime + dur);
                g.gain.setValueAtTime(vol, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
                osc.start(); osc.stop(ctx.currentTime + dur);
            } catch(e) {}
        }
        function playPop() { playFreqSweep(800, 1200, 0.08, 0.25); }

        /** Magical chime for splash screen (C6→E6→G6→C7 rapid arpeggiated shimmer) */
        function playMagicChime() {
            try {
                const ctx = getAudioContext();
                const notes = [1047, 1319, 1568, 2093];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const g = ctx.createGain();
                    osc.connect(g); g.connect(ctx.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    const t = ctx.currentTime + i * 0.09;
                    g.gain.setValueAtTime(0.15, t);
                    g.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
                    osc.start(t); osc.stop(t + 0.4);
                });
                // Add a shimmer overtone
                const shimmer = ctx.createOscillator();
                const sg = ctx.createGain();
                shimmer.connect(sg); sg.connect(ctx.destination);
                shimmer.frequency.value = 3000;
                shimmer.type = 'sine';
                const st = ctx.currentTime + 0.2;
                sg.gain.setValueAtTime(0.06, st);
                sg.gain.exponentialRampToValueAtTime(0.01, st + 0.6);
                shimmer.start(st); shimmer.stop(st + 0.6);
            } catch(e) {}
        }

        /* ── Game map: name → {url, emoji} ── */
        const GAMES = {
            flip:            { url: 'games/flip.html',            emoji: '🐱' },
            memory:          { url: 'games/memory.html',          emoji: '🃏' },
            kleuren:         { url: 'games/kleuren.html',         emoji: '🖍️' },
            letters:         { url: 'games/letters.html',         emoji: '🔤' },
            cijfers:         { url: 'games/cijfers.html',         emoji: '🔢' },
            piano:           { url: 'games/piano.html',           emoji: '🎹' },
            zaklamp:         { url: 'games/zaklamp.html',         emoji: '🔦' },
            kleurensorteren: { url: 'games/kleurensorteren.html', emoji: '🏠' },
            plaatjefout:     { url: 'games/plaatjefout.html',     emoji: '❌' },
            kiekeboe:        { url: 'games/kiekeboe.html',        emoji: '👻' },
            poetsen:         { url: 'games/poetsen.html',         emoji: '🧽' },
            muziektuin:      { url: 'games/muziektuin.html',       emoji: '🌷' },
            sokken:          { url: 'games/sokken.html',          emoji: '🧦' },
            zoekenvind:      { url: 'games/zoekenvind.html',      emoji: '🔍' },
            kamer:           { url: 'games/kamer.html',           emoji: '🛏️' },
            bellen:          { url: 'games/bellen.html',          emoji: '🫧' },
            aankleden:       { url: 'games/aankleden.html',       emoji: '👕' },
            pizza:           { url: 'games/pizza.html',           emoji: '🍕' },
            kleurenmixen:    { url: 'games/kleurenmixen.html',    emoji: '🎨' },
            mixen:           { url: 'games/mixen.html',           emoji: '🥣' },
            draakjes:        { url: 'games/draakjes.html',        emoji: '🐉' },
            boerderij:       { url: 'games/boerderij.html',       emoji: '🚜' },
            bommetjes:       { url: 'games/bommetjes.html',       emoji: '💣' },
            prinses:         { url: 'games/prinses.html',         emoji: '👑' }
        };

        /* ── Home layout: one row per theme (prinses is the hero tile) ── */
        const THEMES = [
            { key: 'dieren', icon: '🐾', label: 'Dieren',         games: ['flip', 'kleurensorteren', 'draakjes', 'boerderij', 'zaklamp'] },
            { key: 'maken',  icon: '🎵', label: 'Muziek en maken', games: ['piano', 'muziektuin', 'kleuren', 'kleurenmixen', 'mixen', 'pizza'] },
            { key: 'thuis',  icon: '🏡', label: 'Thuis',          games: ['poetsen', 'kamer', 'aankleden', 'bellen', 'kiekeboe', 'bommetjes'] },
            { key: 'puzzel', icon: '🧩', label: 'Puzzelen',       games: ['memory', 'letters', 'cijfers', 'plaatjefout', 'sokken', 'zoekenvind'] }
        ];

        function renderThemes() {
            document.getElementById('themes').innerHTML = THEMES.map(theme => `
                <div class="theme theme-${theme.key}" aria-label="${theme.label}">
                    <div class="theme-badge" aria-hidden="true">${theme.icon}</div>
                    <div class="theme-grid">
                        ${theme.games.map(id => `
                            <div class="game-card" role="button" aria-label="${id}" onclick="playGame('${id}')">
                                <span class="game-icon">${GAMES[id].emoji}</span>
                            </div>`).join('')}
                    </div>
                </div>`).join('');
        }
        renderThemes();

        function withVersion(url) {
            const separator = url.includes('?') ? '&' : '?';
            return `${url}${separator}v=${encodeURIComponent(RELEASE_ID)}`;
        }

        /* ── Play game with circular wipe transition + pop sound ── */
        function playGame(gameName) {
            const game = GAMES[gameName];
            if (!game) return;

            playPop();

            const overlay = document.getElementById('gameTransition');
            const emojiEl = document.getElementById('transEmoji');
            emojiEl.textContent = game.emoji;
            overlay.classList.add('active');

            setTimeout(() => { window.location.href = withVersion(game.url); }, 700);
        }

        /* ── Splash screen logic ── */
        function runSplash(onDone) {
            const splash = document.getElementById('splashScreen');
            const titleEl = document.getElementById('splashTitle');
            const text = "Noor's Speelgoed";
            const sparkles = ['✨', '⭐', '💫', '🌟'];

            splash.style.display = 'flex';

            // Create letter spans
            text.split('').forEach((ch, i) => {
                const span = document.createElement('span');
                span.className = 'splash-letter';
                span.textContent = ch === ' ' ? '\u00A0' : ch;
                titleEl.appendChild(span);
            });

            const letters = titleEl.querySelectorAll('.splash-letter');
            const letterDelay = 80; // ms per letter

            // Play magical chime
            playMagicChime();

            // Reveal letters one by one with sparkles
            letters.forEach((letter, i) => {
                setTimeout(() => {
                    letter.classList.add('visible');
                    // Spawn 2-3 sparkle particles per letter
                    const count = 2 + Math.floor(Math.random() * 2);
                    for (let s = 0; s < count; s++) {
                        const spark = document.createElement('span');
                        spark.className = 'sparkle';
                        spark.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
                        // Random direction
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 30 + Math.random() * 50;
                        spark.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
                        spark.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
                        // Position near the letter
                        const rect = letter.getBoundingClientRect();
                        const tRect = titleEl.getBoundingClientRect();
                        spark.style.left = (rect.left - tRect.left + rect.width / 2) + 'px';
                        spark.style.top = (rect.top - tRect.top + rect.height / 2 - 10) + 'px';
                        spark.style.animationDelay = (s * 0.05) + 's';
                        titleEl.appendChild(spark);
                        // Cleanup
                        setTimeout(() => spark.remove(), 900);
                    }
                }, i * letterDelay);
            });

            // After all letters revealed, pause briefly then fade out
            const totalLetterTime = letters.length * letterDelay + 400;
            setTimeout(() => {
                splash.classList.add('fade-out');
                setTimeout(() => {
                    splash.style.display = 'none';
                    onDone();
                }, 500);
            }, totalLetterTime);
        }

        /* ── Staggered card entrance ── */
        function animateCardEntrance() {
            const cards = document.querySelectorAll('.hero, .theme-grid .game-card');
            cards.forEach((card, i) => {
                card.style.animationDelay = (i * 0.04) + 's';
                card.classList.add('card-enter');
                // Drop the fill-mode animation afterwards so hover/tap transforms work again
                card.addEventListener('animationend', () => {
                    card.classList.remove('card-enter');
                    card.style.animationDelay = '';
                }, { once: true });
            });
        }

        /* ── Startup: splash (first session) or straight to cards ── */
        document.addEventListener('DOMContentLoaded', () => {
            const badge = document.getElementById('releaseBadge');
            if (badge) badge.textContent = `v${RELEASE_ID}`;

            const splashSeen = sessionStorage.getItem('splashSeen');
            if (!splashSeen) {
                // Hide home container during splash
                document.getElementById('homeContainer').style.opacity = '0';
                runSplash(() => {
                    sessionStorage.setItem('splashSeen', '1');
                    document.getElementById('homeContainer').style.opacity = '1';
                    animateCardEntrance();
                });
            } else {
                // Skip splash, just do card entrance
                document.getElementById('splashScreen').style.display = 'none';
                animateCardEntrance();
            }
        });

        /* ── Service Worker ── */

        let _refreshing = false;
        let _pendingSwReg = null;

        function showUpdateBanner(registration) {
            _pendingSwReg = registration;
            const banner = document.getElementById('updateBanner');
            const text = document.getElementById('updateBannerText');
            const button = document.getElementById('updateNowBtn');
            if (!banner || !button || !text) return;

            text.textContent = 'Nieuwe versie klaar!';
            button.disabled = false;
            button.textContent = 'Nu updaten';
            banner.classList.add('show');
        }

        function wireUpdateButton() {
            const button = document.getElementById('updateNowBtn');
            const text = document.getElementById('updateBannerText');
            if (!button || !text) return;

            button.addEventListener('click', () => {
                button.disabled = true;
                button.textContent = 'Bezig...';
                text.textContent = 'App wordt bijgewerkt...';

                const waiting = _pendingSwReg && _pendingSwReg.waiting;
                if (waiting) {
                    waiting.postMessage({ type: 'SKIP_WAITING' });
                } else {
                    window.location.reload();
                }
            });
        }

        if ('serviceWorker' in navigator) {
            wireUpdateButton();

            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (_refreshing) return;
                _refreshing = true;
                window.location.reload();
            });

            navigator.serviceWorker.register(`sw.js?release=${encodeURIComponent(RELEASE_ID)}`, { updateViaCache: 'none' })
                .then(reg => {
                    console.log('Service Worker registered');

                    if (reg.waiting) {
                        showUpdateBanner(reg);
                    }

                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        if (!newWorker) return;

                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                showUpdateBanner(reg);
                            }
                        });
                    });

                    setInterval(() => {
                        reg.update().catch(() => {});
                    }, 60 * 1000);
                })
                .catch(err => console.log('Service Worker registration failed:', err));
        }
    </script>
</body>
</html>
